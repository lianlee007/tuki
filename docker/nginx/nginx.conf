# =============================================================================
# Configuración raíz de Nginx para Tuki.
#
# Se ejecuta como usuario sin privilegios (UID/GID 101) y escucha en 8080.
# El PID y todos los directorios temporales viven en /tmp para que el sistema
# de archivos del contenedor pueda montarse como de solo lectura.
# =============================================================================

worker_processes auto;
pid /tmp/nginx.pid;

error_log /dev/stderr warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';

    access_log /dev/stdout main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    server_tokens       off;

    # Solo se sirven archivos estáticos: un cuerpo grande no tiene utilidad.
    client_max_body_size   1m;
    client_body_timeout    10s;
    client_header_timeout  10s;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
