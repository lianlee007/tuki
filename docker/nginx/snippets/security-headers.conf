# =============================================================================
# Cabeceras de seguridad comunes.
#
# Nginx no hereda `add_header` cuando el bloque hijo declara alguno, por eso
# este archivo se incluye tanto en el servidor como en cada location que añade
# su propia cabecera (cache, etc.).
#
# La CSP permite de forma explícita los servicios que la aplicación ya usa:
#   - cdn.tailwindcss.com: Tailwind Play CDN (se carga desde index.html).
#   - fonts.googleapis.com / fonts.gstatic.com: tipografías.
#   - *.supabase.co: API, autenticación, realtime (wss) y Storage.
# La IA de Groq ya no se llama desde el navegador: pasa por `/api` (mismo
# origen) y la clave queda en el AI Gateway. Gemini se retiró del proyecto, por
# eso su origen tampoco se permite.
# `unsafe-inline` y `unsafe-eval` son necesarios por el Tailwind CDN y los
# scripts inline del index. Si algún día se compila Tailwind en el build,
# conviene endurecer la CSP y retirar ambos.
# =============================================================================

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://cdn.tailwindcss.com; manifest-src 'self'" always;
