server {
    listen 8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    # Sonda usada por Docker y Kubernetes. No toca disco ni ensucia los logs.
    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # El HTML no se cachea: cada despliegue debe apuntar a los assets nuevos.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }

    # Vite genera nombres con hash: se pueden cachear de forma inmutable.
    # `^~` evita que la regla regex de abajo sustituya esta cabecera.
    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Archivos servidos desde public/ (por ejemplo styles/apple-tokens.css).
    # No llevan hash en el nombre, así que se revalidan en cada visita.
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|avif|ico)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        access_log off;
        try_files $uri =404;
    }

    # AI Gateway: mismo origen que la SPA, sin exponer claves en el navegador.
    # Se usa un upstream estático para que Nginx no dependa de un resolver
    # externo. En Compose el nombre `backend` lo resuelve el DNS interno; en
    # Kubernetes, el Service del mismo namespace. Si el gateway está caído,
    # Nginx sigue sirviendo la SPA y devuelve 502 solo en /api/.
    location ^~ /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;

        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
        proxy_request_buffering on;
        proxy_hide_header Server;

        client_max_body_size 64k;
    }

    # Servicio de visión (Ultralytics): recibe la foto antes de publicarla.
    # Nginx quita el prefijo /vision; el servicio expone /api/v1/vision/... .
    location ^~ /vision/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;

        proxy_pass http://vision:8000/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_hide_header Server;

        # La foto se revisa antes de comprimirla en el navegador: se permite el
        # mismo tope que valida el servicio (8 MB) con margen.
        client_max_body_size 10m;
    }

    # SPA: cualquier ruta desconocida resuelve a index.html y React Router
    # decide si la página existe o muestra la vista 404.
    location / {
        try_files $uri /index.html;
    }
}

# -----------------------------------------------------------------------------
# Métricas de Nginx para el sidecar nginx-prometheus-exporter.
# Escucha solo en loopback: no se publica fuera del pod/contenedor.
# -----------------------------------------------------------------------------
server {
    listen 127.0.0.1:8081;
    server_name _;

    access_log off;

    location = /stub_status {
        stub_status;
        allow 127.0.0.1;
        deny all;
    }
}
