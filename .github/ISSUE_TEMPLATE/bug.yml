name: Reportar un error
description: Algo no funciona como se esperaba.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportar. No incluyas credenciales, tokens ni datos personales.
  - type: textarea
    id: esperado
    attributes:
      label: Qué esperabas que pasara
      placeholder: Describí el comportamiento esperado.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Qué pasó realmente
      placeholder: Incluí el mensaje de error o la captura.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Levanté el stack con ...
        2. Abrí ...
        3. Hice clic en ...
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit o versión
      placeholder: "Ejemplo: c413b8b"
  - type: dropdown
    id: entorno
    attributes:
      label: Entorno
      options:
        - Docker Compose
        - Kubernetes local
        - Desarrollo con pnpm
        - Otro
  - type: textarea
    id: evidencia
    attributes:
      label: Evidencia
      description: Logs, salida de comandos o capturas.
