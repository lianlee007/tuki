# CD · promoción GitOps
#
# Qué hace: cierra el bucle. Verifica con Cosign que las dos imágenes del tag
# estén firmadas por este repositorio, actualiza el `newTag` del overlay de
# producción y abre un PR. Al mergear, ArgoCD sincroniza el clúster.
# Nunca aplica nada con kubectl: el clúster solo se toca desde Git.
#
# Cuándo corre: al empujar un tag `vX.Y.Z` o a mano (workflow_dispatch con el
# tag ya publicado). El CI debe haber construido antes ese tag en GHCR.
#
# Requisito del repositorio (una sola vez): Settings -> Actions -> General ->
# "Allow GitHub Actions to create and approve pull requests". Sin eso, el paso
# "Abrir PR de promoción" falla con 403 aunque el resto esté en verde.
#
# Qué revisar:
#   1. Si falla en "Esperar a que el CI publique y firme el tag": en 30 minutos
#      el tag no apareció firmado en GHCR. Revisa el CI del tag.
#   2. Si dice "nada que promover": el overlay ya apunta a ese tag.
#   3. En el PR: que el diff sea solo `deploy/k8s/overlays/production`.
#   4. Tras el merge: estado `Synced/Healthy` en ArgoCD.
name: CD · promoción GitOps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag ya publicado (p. ej. v1.2.3)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  packages: read
  id-token: write

concurrency:
  group: promover-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  AMBIENTE: production

jobs:
  promover:
    name: Verificar firma y proponer el tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Calcular nombres de imagen
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "web=ghcr.io/${owner}/tuki" >> "$GITHUB_OUTPUT"
          echo "gateway=ghcr.io/${owner}/tuki-ai-gateway" >> "$GITHUB_OUTPUT"

      - name: Instalar Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      # Las imágenes viven en un paquete privado de GHCR: sin login, Cosign
      # consulta como anónimo y recibe 403 aunque el tag exista y esté firmado.
      - name: Autenticarse en GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # El tag dispara CI y CD a la vez: la imagen tarda unos minutos en
      # publicarse y firmarse. Esperamos a que exista en vez de fallar.
      - name: Esperar a que el CI publique y firme el tag
        env:
          WEB: ${{ steps.image.outputs.web }}
          GATEWAY: ${{ steps.image.outputs.gateway }}
        run: |
          identidad="^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/contenedor.yml@refs/(heads|tags)/.*$"
          for intento in $(seq 1 30); do
            listo=1
            for imagen in "$WEB" "$GATEWAY"; do
              if ! cosign verify "${imagen}:${TAG}" \
                --certificate-identity-regexp "$identidad" \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null 2>&1; then
                listo=0
                break
              fi
            done
            if [ "$listo" = "1" ]; then
              echo "Ambas imágenes de ${TAG} están firmadas por este repositorio."
              exit 0
            fi
            echo "Intento ${intento}/30: ${TAG} aún no está firmado en GHCR. Espero 60 s."
            if [ "$intento" = "30" ]; then
              echo "::error::${TAG} no apareció firmado en 30 minutos. Revisa el CI del tag."
              exit 1
            fi
            sleep 60
          done

      # Segunda pasada visible en el log: deja la evidencia de la firma.
      - name: Verificar que ambas imágenes están firmadas por este repositorio
        env:
          WEB: ${{ steps.image.outputs.web }}
          GATEWAY: ${{ steps.image.outputs.gateway }}
        run: |
          identidad="^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/contenedor.yml@refs/(heads|tags)/.*$"
          for imagen in "$WEB" "$GATEWAY"; do
            echo "Verificando ${imagen}:${TAG}"
            cosign verify "${imagen}:${TAG}" \
              --certificate-identity-regexp "$identidad" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          done

      - name: Actualizar el overlay
        run: node scripts/promover-imagen.mjs "$TAG" --ambiente "$AMBIENTE"

      - name: Abrir PR de promoción
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if git diff --quiet; then
            echo "El overlay ya apunta a $TAG; nada que promover."
            exit 0
          fi

          rama="chore/promover-${TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$rama"
          git add "deploy/k8s/overlays/$AMBIENTE/kustomization.yaml"
          git commit -m "chore(despliegue): promueve ${TAG} a ${AMBIENTE}"
          git push -u origin "$rama"

          gh pr create \
            --title "chore(despliegue): promueve ${TAG} a ${AMBIENTE}" \
            --body "Promoción automática de \`${TAG}\`.

          - Imágenes verificadas con Cosign (keyless, workflow \`contenedor.yml\`).
          - Overlay: \`deploy/k8s/overlays/${AMBIENTE}\`.
          - Al hacer merge, ArgoCD sincroniza y el clúster converge.

          Revisa el diff y el estado de ArgoCD antes de aprobar." \
            --base main \
            --head "$rama"

      - name: Resumen
        run: |
          {
            echo "### Promoción ${TAG}"
            echo ""
            echo "| Imagen | Verificada |"
            echo "| --- | --- |"
            echo "| \`${{ steps.image.outputs.web }}:${TAG}\` | ✅ |"
            echo "| \`${{ steps.image.outputs.gateway }}:${TAG}\` | ✅ |"
          } >> "$GITHUB_STEP_SUMMARY"
