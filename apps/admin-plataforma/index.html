<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TukiTuki — Administración</title>
    <meta
      name="description"
      content="Consola de superadministración de TukiTuki: restaurantes, cuentas, permisos y auditoría."
    />
    <meta name="theme-color" content="#B34A2E" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Aplica el tema guardado antes del primer pintado para evitar el fogonazo.
      try {
        var modoGuardado = localStorage.getItem('tema');
        if (modoGuardado === 'dark' || modoGuardado === 'light') {
          document.documentElement.classList.add(modoGuardado);
          document.documentElement.style.colorScheme = modoGuardado;
        }
      } catch (e) {
        /* sin localStorage: se queda en claro */
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script src="/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
