<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Exploraciones 4</title>
<style>
  :root { --terra:#C2410C; --tinta:#1D1D1F; --papel:#FBF8F4; --sup:#F2ECE4; --borde:#E6DCD0; --sec:#6E6E73; }
  * { box-sizing: border-box; }
  body { margin:0; padding:40px; background:var(--papel); color:var(--tinta);
         font-family: Inter, -apple-system, "Segoe UI", sans-serif; }
  h1 { font-size:22px; letter-spacing:-.02em; margin:0 0 6px; }
  p.lead { color:var(--sec); font-size:13px; margin:0 0 28px; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }
  .card { background:#fff; border:1px solid var(--borde); border-radius:18px; padding:16px; }
  .card h2 { font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--sec); margin:0 0 14px; }
  .row { display:flex; align-items:end; gap:16px; }
  .big { width:112px; height:112px; border-radius:14px; background:var(--sup); display:flex; align-items:center; justify-content:center; }
  .small { display:flex; flex-direction:column; gap:8px; align-items:center; }
  .small span { font-size:9px; color:var(--sec); }
  .tile { width:112px; height:112px; border-radius:26px; background:var(--terra); display:flex; align-items:center; justify-content:center; }
  svg { display:block; }
</style>
</head>
<body>
<h1>Exploraciones 4 · el puesto, la olla y la luz</h1>
<p class="lead">Tres familias para comparar: mercado, mesa y lámpara.</p>
<div class="grid" id="grid"></div>
<script>
const C = '#C2410C', P = '#FBF8F4';

const scallops = (y, x0=6, x1=58, n=8) => {
  const w = (x1-x0)/n; let d = `M${x0} ${y}`;
  for (let i=0;i<n;i++) d += ` Q${x0+w*(i+0.5)} ${y+7} ${x0+w*(i+1)} ${y}`;
  return d;
};

const conceptos = {
  'Puesto llano': `
    <rect x="6" y="12" width="52" height="8" rx="2"/>
    <path d="${scallops(20)} V26 H6 Z"/>
    <rect x="12" y="26" width="6" height="24" rx="2"/>
    <rect x="46" y="26" width="6" height="24" rx="2"/>
    <rect x="7" y="45" width="50" height="8" rx="4"/>
    <rect x="10" y="53" width="44" height="3" rx="1.5"/>`,
  'Puesto arqueado': `
    <path d="M6 18 Q6 10 14 10 H50 Q58 10 58 18 V22 H6 Z"/>
    <path d="${scallops(22)} V27 H6 Z"/>
    <rect x="12" y="27" width="6" height="23" rx="2"/>
    <rect x="46" y="27" width="6" height="23" rx="2"/>
    <rect x="8" y="45" width="48" height="8" rx="4"/>
    <rect x="10" y="53" width="44" height="3" rx="1.5"/>`,
  'Puesto rayado': `
    <path fill-rule="evenodd" d="M6 12 H58 V22 H6 Z
      M12 12 V22 H18 V12 Z M26 12 V22 H32 V12 Z M40 12 V22 H46 V12 Z"/>
    <path d="${scallops(22)} V27 H6 Z"/>
    <rect x="12" y="27" width="6" height="23" rx="2"/>
    <rect x="46" y="27" width="6" height="23" rx="2"/>
    <rect x="8" y="45" width="48" height="8" rx="4"/>
    <rect x="10" y="53" width="44" height="3" rx="1.5"/>`,
  'Puesto y plato': `
    <rect x="6" y="12" width="52" height="8" rx="2"/>
    <path d="${scallops(20)} V26 H6 Z"/>
    <rect x="12" y="26" width="6" height="18" rx="2"/>
    <rect x="46" y="26" width="6" height="18" rx="2"/>
    <rect x="7" y="39" width="50" height="8" rx="4"/>
    <ellipse cx="32" cy="34" rx="8" ry="2.6"/>
    <rect x="10" y="53" width="44" height="3" rx="1.5"/>`,
  'Puesto y dos taburetes': `
    <rect x="6" y="12" width="52" height="8" rx="2"/>
    <path d="${scallops(20)} V26 H6 Z"/>
    <rect x="12" y="26" width="6" height="16" rx="2"/>
    <rect x="46" y="26" width="6" height="16" rx="2"/>
    <rect x="7" y="37" width="50" height="7" rx="3.5"/>
    <circle cx="22" cy="49" r="5"/><rect x="20" y="49" width="4" height="7" rx="2"/>
    <circle cx="42" cy="49" r="5"/><rect x="40" y="49" width="4" height="7" rx="2"/>`,
  'Puesto de un poste': `
    <path d="M6 16 Q6 8 16 8 H48 Q58 8 58 16 V20 H6 Z"/>
    <path d="${scallops(20)} V25 H6 Z"/>
    <rect x="29" y="25" width="6" height="20" rx="3"/>
    <rect x="10" y="41" width="44" height="7" rx="3.5"/>
    <rect x="8" y="48" width="48" height="4" rx="2"/>`,
  'Cazuela': `
    <path fill-rule="evenodd" d="M12 24 H52 A5 5 0 0 1 57 29 V36 A25 25 0 0 1 7 36 V29 A5 5 0 0 1 12 24 Z
      M12 31 H52 V36 A20 20 0 0 1 12 36 Z"/>
    <path d="M12 29 C4 29 4 40 12 40" stroke="${C}" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M52 29 C60 29 60 40 52 40" stroke="${C}" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M12 31 H52" stroke="${P}" stroke-width="2.5"/>`,
  'Cazuela con cuchara': `
    <path d="M12 26 H52 A5 5 0 0 1 57 31 V37 A25 25 0 0 1 7 37 V31 A5 5 0 0 1 12 26 Z"/>
    <path d="M12 31 C4 31 4 42 12 42" stroke="${C}" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M52 31 C60 31 60 42 52 42" stroke="${C}" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M38 6 L28 30" stroke="${C}" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="39" cy="6" rx="6" ry="4" transform="rotate(-30 39 6)"/>`,
  'Mesa y lámpara colgante': `
    <rect x="30.5" y="4" width="3" height="14" rx="1.5"/>
    <path d="M18 24 Q18 17 32 17 Q46 17 46 24 Z"/>
    <circle cx="32" cy="28" r="3.4"/>
    <rect x="8" y="42" width="48" height="7" rx="3.5"/>
    <rect x="18" y="49" width="6" height="11" rx="2"/>
    <rect x="40" y="49" width="6" height="11" rx="2"/>`,
  'Mesa y lámpara de mesa': `
    <path d="M23 16 Q23 10 32 10 Q41 10 41 16 V22 H23 Z"/>
    <rect x="30" y="22" width="4" height="12"/>
    <ellipse cx="32" cy="35" rx="7" ry="2.4"/>
    <rect x="8" y="38" width="48" height="7" rx="3.5"/>
    <rect x="18" y="45" width="6" height="13" rx="2"/>
    <rect x="40" y="45" width="6" height="13" rx="2"/>`,
  'Mesa y dos sillas': `
    <rect x="22" y="26" width="20" height="6" rx="3"/>
    <rect x="24" y="32" width="5" height="22" rx="2.5"/>
    <rect x="35" y="32" width="5" height="22" rx="2.5"/>
    <path d="M6 18 V40 H20" stroke="${C}" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M8 40 V54 M18 40 V54" stroke="${C}" stroke-width="4" stroke-linecap="round"/>
    <path d="M58 18 V40 H44" stroke="${C}" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M56 40 V54 M46 40 V54" stroke="${C}" stroke-width="4" stroke-linecap="round"/>`,
  'Mesa y sillas (planta)': `
    <rect x="20" y="20" width="24" height="24" rx="7"/>
    <rect x="25" y="9" width="14" height="6" rx="3"/>
    <rect x="49" y="25" width="6" height="14" rx="3"/>
    <circle cx="30" cy="30" r="3.4" fill="${P}"/>
    <circle cx="39" cy="38" r="3.4" fill="${P}"/>`,
};
const grid = document.getElementById('grid');
for (const [nombre, cuerpo] of Object.entries(conceptos)) {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<h2>${nombre}</h2>
    <div class="row">
      <div class="big"><svg width="92" height="92" viewBox="0 0 64 64" fill="${C}" stroke="none">${cuerpo}</svg></div>
      <div class="small">
        <svg width="40" height="40" viewBox="0 0 64 64" fill="${C}" stroke="none">${cuerpo}</svg>
        <svg width="16" height="16" viewBox="0 0 64 64" fill="${C}" stroke="none">${cuerpo}</svg>
        <span>40 · 16</span>
      </div>
    </div>
    <div style="margin-top:14px"><div class="tile"><svg width="72" height="72" viewBox="0 0 64 64" fill="${P}" stroke="none">${cuerpo}</svg></div></div>`;
  grid.appendChild(card);
}
</script>
</body>
</html>
