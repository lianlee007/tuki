<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Render final</title>
<style>
  body { margin:0; padding:24px; background:#FBF8F4; font-family: Inter, sans-serif; }
  canvas { display:block; margin-bottom:16px; }
</style>
</head>
<body>
<canvas id="contacto" width="1500" height="980"></canvas>
<canvas id="regular" width="512" height="512"></canvas>
<canvas id="maskable" width="512" height="512"></canvas>
<script>
const C = '#C2410C', P = '#FBF8F4';
const FLAME = 'M30 32.5 C27 30.5 24 26 24.5 21 C25 17 27 14 29.5 11.5 C29 14.5 30 16.5 31.5 17.5 C32 14 32 11 33 8.5 C36 12.5 39.5 16.5 39 22 C38.5 27 35.5 30.5 34 32.5 C32.7 33.5 31.3 33.5 30 32.5 Z';
const mesa = (ctx, x, y, s) => {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.beginPath(); ctx.roundRect(12, 32.5, 40, 7, 3.5); ctx.fill();
  ctx.beginPath(); ctx.roundRect(18, 39.5, 6, 12, 2); ctx.fill();
  ctx.beginPath(); ctx.roundRect(40, 39.5, 6, 12, 2); ctx.fill();
  ctx.restore();
};
const llama = (ctx, x, y, s, color) => {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = color; ctx.fill(new Path2D(FLAME));
  ctx.restore();
};
const icono = (ctx, s, escala) => {
  ctx.fillStyle = C; ctx.fillRect(0, 0, s, s);
  const k = (s / 64) * escala;
  llama(ctx, 32 * (s / 64) + (32 - 32 * escala) * (s / 64), 32 * (s / 64) + (32 - 32 * escala) * (s / 64), k, P);
  mesa(ctx, 32 * (s / 64) + (32 - 32 * escala) * (s / 64), 32 * (s / 64) + (32 - 32 * escala) * (s / 64), k);
};

function cargar(src) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = rej;
    img.src = src;
  });
}

window.generar = async () => {
  // Iconos 512: a sangre, sin esquinas redondeadas.
  const r = document.getElementById('regular').getContext('2d');
  const m = document.getElementById('maskable').getContext('2d');
  r.fillStyle = C; r.fillRect(0, 0, 512, 512);
  r.save(); r.translate(256, 256); r.scale(1.12 * 8, 1.12 * 8); r.translate(-32, -32);
  r.fillStyle = P; r.fill(new Path2D(FLAME));
  r.beginPath(); r.roundRect(12, 32.5, 40, 7, 3.5); r.fill();
  r.beginPath(); r.roundRect(18, 39.5, 6, 12, 2); r.fill();
  r.beginPath(); r.roundRect(40, 39.5, 6, 12, 2); r.fill();
  r.restore();
  m.fillStyle = C; m.fillRect(0, 0, 512, 512);
  m.save(); m.translate(256, 256); m.scale(0.84 * 8, 0.84 * 8); m.translate(-32, -32);
  m.fillStyle = P; m.fill(new Path2D(FLAME));
  m.beginPath(); m.roundRect(12, 32.5, 40, 7, 3.5); m.fill();
  m.beginPath(); m.roundRect(18, 39.5, 6, 12, 2); m.fill();
  m.beginPath(); m.roundRect(40, 39.5, 6, 12, 2); m.fill();
  m.restore();

  const descargar = (canvas, nombre) => canvas.toBlob((b) => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = nombre;
    a.click();
  }, 'image/png');
  descargar(document.getElementById('regular'), 'icono-512.png');
  descargar(document.getElementById('maskable'), 'icono-maskable-512.png');

  // Hoja de contacto.
  const cv = document.getElementById('contacto');
  const ctx = cv.getContext('2d');
  ctx.fillStyle = P; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = '#1D1D1F'; ctx.font = '600 13px Inter, sans-serif';
  const urls = {
    simbolo: '../simbolo.svg',
    icono: '../icono.svg',
    logotipo: '../logotipo.svg',
    tukituki: '../logotipo-tukituki.svg',
    horizontal: '../marca-horizontal.svg',
    apilada: '../marca-apilada.svg',
  };
  const imgs = {};
  for (const [k, v] of Object.entries(urls)) {
    const txt = await (await fetch(v)).text();
    imgs[k] = await cargar('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(txt));
  }
  ctx.fillText('Símbolo', 40, 30);
  ctx.drawImage(imgs.simbolo, 40, 44, 200, 200);
  ctx.fillText('Icono', 280, 30);
  ctx.drawImage(imgs.icono, 280, 44, 200, 200);
  ctx.fillText('«Tuki»', 520, 30);
  ctx.drawImage(imgs.logotipo, 520, 44, 620, 298);
  ctx.fillText('«TukiTuki»', 40, 340);
  ctx.drawImage(imgs.tukituki, 40, 354, 860, 204);
  ctx.fillText('Marca horizontal', 40, 620);
  ctx.drawImage(imgs.horizontal, 40, 634, 700, 295);
  ctx.fillText('Marca apilada', 800, 620);
  ctx.drawImage(imgs.apilada, 800, 634, 320, 201);
  descargar(cv, 'contacto-final.png');
  return 'ok';
};
</script>
</body>
</html>
