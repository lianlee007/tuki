<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Exploraciones 2</title>
<style>
  :root { --terra:#C2410C; --tinta:#1D1D1F; --papel:#FBF8F4; --sup:#F2ECE4; --borde:#E6DCD0; --sec:#6E6E73; }
  * { box-sizing: border-box; }
  body { margin:0; padding:40px; background:var(--papel); color:var(--tinta);
         font-family: Inter, -apple-system, "Segoe UI", sans-serif; }
  h1 { font-size:22px; letter-spacing:-.02em; margin:0 0 6px; }
  p.lead { color:var(--sec); font-size:13px; margin:0 0 28px; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }
  .card { background:#fff; border:1px solid var(--borde); border-radius:18px; padding:16px; }
  .card h2 { font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--sec); margin:0 0 14px; }
  .row { display:flex; align-items:end; gap:16px; }
  .big { width:112px; height:112px; border-radius:14px; background:var(--sup); display:flex; align-items:center; justify-content:center; }
  .small { display:flex; flex-direction:column; gap:8px; align-items:center; }
  .small span { font-size:9px; color:var(--sec); }
  .tile { width:112px; height:112px; border-radius:26px; background:var(--terra); display:flex; align-items:center; justify-content:center; }
  svg { display:block; }
</style>
</head>
<body>
<h1>Exploraciones 2 · mesa, puesto y plato</h1>
<p class="lead">Bocetos de silueta. Todavía sin pulir.</p>
<div class="grid" id="grid"></div>
<script>
const C = '#C2410C', P = '#FBF8F4';
const conceptos = {
  'Puesto de mercado': `
    <path d="M6 12 H58 V20 H6 Z"/>
    <path d="M6 20 Q10 26 14 20 Q18 26 22 20 Q26 26 30 20 Q34 26 38 20 Q42 26 46 20 Q50 26 54 20 Q56 23 58 20 V26 H6 Z"/>
    <rect x="12" y="26" width="6" height="24" rx="2"/>
    <rect x="46" y="26" width="6" height="24" rx="2"/>
    <rect x="8" y="46" width="48" height="7" rx="3.5"/>`,
  'Puesto con plato': `
    <path d="M6 10 H58 V18 H6 Z"/>
    <path d="M6 18 Q10 24 14 18 Q18 24 22 18 Q26 24 30 18 Q34 24 38 18 Q42 24 46 18 Q50 24 54 18 Q56 21 58 18 V22 H6 Z"/>
    <rect x="12" y="22" width="5" height="17" rx="2"/>
    <rect x="47" y="22" width="5" height="17" rx="2"/>
    <rect x="7" y="39" width="50" height="7" rx="3.5"/>
    <circle cx="32" cy="31" r="5"/>`,
  'Mesa y sillas (planta)': `
    <rect x="18" y="18" width="28" height="28" rx="7"/>
    <rect x="24" y="8" width="16" height="7" rx="3.5"/>
    <rect x="49" y="24" width="7" height="16" rx="3.5"/>
    <circle cx="29" cy="29" r="4" fill="${P}"/>
    <circle cx="38" cy="38" r="4" fill="${P}"/>`,
  'Mesa redonda y dos sillas': `
    <circle cx="32" cy="32" r="16"/>
    <path d="M18 16 A20 20 0 0 1 46 16" stroke="${C}" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M18 48 A20 20 0 0 0 46 48" stroke="${C}" stroke-width="7" fill="none" stroke-linecap="round"/>`,
  'Cazuela de dos asas': `
    <path d="M14 26 H50 A6 6 0 0 1 56 32 V38 A24 24 0 0 1 8 38 V32 A6 6 0 0 1 14 26 Z"/>
    <path d="M8 30 H2 V40 H10" stroke="${C}" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M56 30 H62 V40 H54" stroke="${C}" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`,
  'Mesa con mantel': `
    <path d="M8 16 H56 V22 Q50 24 50 30 V56 H44 V30 Q44 24 38 22 H26 Q20 24 20 30 V56 H14 V30 Q14 24 8 22 Z"/>`,
  'Mesa y silla': `
    <rect x="28" y="20" width="30" height="7" rx="3.5"/>
    <rect x="51" y="27" width="7" height="27" rx="3.5"/>
    <rect x="10" y="12" width="6" height="26" rx="3"/>
    <rect x="10" y="34" width="20" height="6" rx="3"/>
    <rect x="12" y="40" width="6" height="14" rx="3"/>
    <rect x="24" y="40" width="6" height="14" rx="3"/>`,
  'Mesa de dos, unida': `
    <path d="M6 16 H30 V22 H28 V50 H22 V22 H6 Z"/>
    <path d="M58 16 H34 V22 H36 V50 H42 V22 H58 Z"/>`,
  'Mesa larga y bancos': `
    <rect x="10" y="26" width="44" height="9" rx="4.5"/>
    <rect x="16" y="10" width="32" height="6" rx="3"/>
    <rect x="16" y="45" width="32" height="6" rx="3"/>
    <rect x="20" y="35" width="5" height="10" rx="2.5"/>
    <rect x="39" y="35" width="5" height="10" rx="2.5"/>`,
  'T y mesa': `
    <path fill-rule="evenodd" d="M6 12 H58 V22 H37 V56 H27 V22 H6 Z M30 28 H34 V36 H30 Z"/>`,
  'Mesa y lámpara': `
    <rect x="8" y="34" width="48" height="8" rx="4"/>
    <rect x="16" y="42" width="7" height="14" rx="3.5"/>
    <rect x="41" y="42" width="7" height="14" rx="3.5"/>
    <rect x="30" y="8" width="4" height="10" rx="2"/>
    <path d="M20 18 H44 L38 30 H26 Z"/>`,
  'Dos platos': `
    <circle cx="24" cy="32" r="16"/>
    <circle cx="40" cy="32" r="16" fill="${P}" stroke="${C}" stroke-width="6"/>`,
};
const grid = document.getElementById('grid');
for (const [nombre, cuerpo] of Object.entries(conceptos)) {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<h2>${nombre}</h2>
    <div class="row">
      <div class="big"><svg width="92" height="92" viewBox="0 0 64 64" fill="${C}" style="color:${C}">${cuerpo}</svg></div>
      <div class="small">
        <svg width="40" height="40" viewBox="0 0 64 64" fill="${C}">${cuerpo}</svg>
        <svg width="16" height="16" viewBox="0 0 64 64" fill="${C}">${cuerpo}</svg>
        <span>40 · 16</span>
      </div>
    </div>
    <div style="margin-top:14px"><div class="tile"><svg width="72" height="72" viewBox="0 0 64 64" fill="${P}">${cuerpo}</svg></div></div>`;
  grid.appendChild(card);
}
</script>
</body>
</html>
