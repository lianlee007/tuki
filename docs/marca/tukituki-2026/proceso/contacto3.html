<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Exploraciones 3 · la mesa encendida</title>
<style>
  :root { --terra:#C2410C; --tinta:#1D1D1F; --papel:#FBF8F4; --sup:#F2ECE4; --borde:#E6DCD0; --sec:#6E6E73; }
  * { box-sizing: border-box; }
  body { margin:0; padding:40px; background:var(--papel); color:var(--tinta);
         font-family: Inter, -apple-system, "Segoe UI", sans-serif; }
  h1 { font-size:22px; letter-spacing:-.02em; margin:0 0 6px; }
  p.lead { color:var(--sec); font-size:13px; margin:0 0 28px; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }
  .card { background:#fff; border:1px solid var(--borde); border-radius:18px; padding:16px; }
  .card h2 { font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--sec); margin:0 0 14px; }
  .row { display:flex; align-items:end; gap:16px; }
  .big { width:112px; height:112px; border-radius:14px; background:var(--sup); display:flex; align-items:center; justify-content:center; }
  .small { display:flex; flex-direction:column; gap:8px; align-items:center; }
  .small span { font-size:9px; color:var(--sec); }
  .tile { width:112px; height:112px; border-radius:26px; background:var(--terra); display:flex; align-items:center; justify-content:center; }
  svg { display:block; }
</style>
</head>
<body>
<h1>Exploraciones 3 · la mesa encendida</h1>
<p class="lead">Una mesa de pedestal, una vela y su llama. La «t» minúscula aparece sola.</p>
<div class="grid" id="grid"></div>
<script>
const C = '#C2410C', P = '#FBF8F4';
// Llama: punta arriba, base redonda. Cortada con una llama interior.
const llama = (cx=32, cy=13, s=1) => `
  <path fill-rule="evenodd" d="M${cx} ${cy-8*s}
    C${cx+2.6*s} ${cy-3.5*s} ${cx+6*s} ${cy+0.5*s} ${cx+6*s} ${cy+4.5*s}
    A${6*s} ${6*s} 0 0 1 ${cx-6*s} ${cy+4.5*s}
    C${cx-6*s} ${cy+0.5*s} ${cx-2.6*s} ${cy-3.5*s} ${cx} ${cy-8*s} Z
    M${cx} ${cy-1.5*s}
    C${cx+1.4*s} ${cy+0.8*s} ${cx+2.6*s} ${cy+2}s ${cx+2.6*s} ${cy+4.2*s}
    A${2.6*s} ${2.6*s} 0 0 1 ${cx-2.6*s} ${cy+4.2*s}
    C${cx-2.6*s} ${cy+2*s} ${cx-1.4*s} ${cy+0.8*s} ${cx} ${cy-1.5*s} Z"/>`;

const vela = (tabla, platos='') => `
  ${llama()}
  <rect x="30.4" y="19" width="3.2" height="3" rx="1.2"/>
  <rect x="28.6" y="22" width="6.8" height="16" rx="3.4"/>
  <ellipse cx="32" cy="38.8" rx="7" ry="1.8"/>
  ${tabla}
  ${platos}`;

const mesaRecta = `
  <rect x="10" y="39" width="44" height="7" rx="3.5"/>
  <rect x="30" y="46" width="4" height="9"/>
  <rect x="22" y="55" width="20" height="5" rx="2.5"/>`;
const mesaElipse = `
  <ellipse cx="32" cy="42" rx="24" ry="4.6"/>
  <rect x="30" y="42" width="4" height="13"/>
  <rect x="22" y="55" width="20" height="5" rx="2.5"/>`;
const mesaDosPatas = `
  <rect x="10" y="39" width="44" height="7" rx="3.5"/>
  <rect x="18" y="46" width="6" height="14" rx="3"/>
  <rect x="40" y="46" width="6" height="14" rx="3"/>`;
const mesaMantel = `
  <path d="M10 39 H54 V44 Q50 45 50 49 V56 H44 V49 Q44 45 40 44 H24 Q20 45 20 49 V56 H14 V49 Q14 45 10 44 Z"/>`;
const platosRecta = `
  <ellipse cx="20" cy="42.5" rx="4.2" ry="1.7" fill="${P}"/>
  <ellipse cx="44" cy="42.5" rx="4.2" ry="1.7" fill="${P}"/>`;

const conceptos = {
  'Recta, pedestal': vela(mesaRecta),
  'Recta con platos': vela(mesaRecta, platosRecta),
  'Elíptica, pedestal': vela(mesaElipse),
  'Elíptica con platos': vela(mesaElipse, `
    <ellipse cx="16.5" cy="41.5" rx="5" ry="2" fill="${P}"/>
    <ellipse cx="47.5" cy="41.5" rx="5" ry="2" fill="${P}"/>`),
  'Dos patas': vela(mesaDosPatas),
  'Con mantel': vela(mesaMantel),
  'Sin platos, gruesa': vela(`
    <rect x="8" y="38" width="48" height="9" rx="4.5"/>
    <rect x="28.5" y="47" width="7" height="8"/>
    <rect x="20" y="55" width="24" height="6" rx="3"/>`),
  'Llama chispa': `
    <path d="M32 4 Q33.2 9.5 38.5 10.7 Q33.2 11.9 32 17.4 Q30.8 11.9 25.5 10.7 Q30.8 9.5 32 4 Z"/>
    <rect x="30.4" y="18" width="3.2" height="4" rx="1.2"/>
    <rect x="28.6" y="22" width="6.8" height="16" rx="3.4"/>
    <ellipse cx="32" cy="38.8" rx="7" ry="1.8"/>
    <rect x="10" y="39" width="44" height="7" rx="3.5"/>
    <rect x="30" y="46" width="4" height="9"/>
    <rect x="22" y="55" width="20" height="5" rx="2.5"/>`,
  'Vela alta, mesa baja': `
    <path fill-rule="evenodd" d="M32 5 C34.6 9.5 38 13.5 38 17.5 A6 6 0 0 1 26 17.5 C26 13.5 29.4 9.5 32 5 Z M32 11.5 C33.4 13.8 34.6 15 34.6 17.2 A2.6 2.6 0 0 1 29.4 17.2 C29.4 15 30.6 13.8 32 11.5 Z"/>
    <rect x="30.4" y="23" width="3.2" height="3" rx="1.2"/>
    <rect x="28.8" y="26" width="6.4" height="13" rx="3.2"/>
    <ellipse cx="32" cy="39" rx="6" ry="1.6"/>
    <rect x="8" y="39.5" width="48" height="6.5" rx="3.2"/>
    <rect x="30.5" y="46" width="3" height="9"/>
    <rect x="23" y="55" width="18" height="5" rx="2.5"/>`,
  'Dos velas': `
    ${llama(26,13)}${llama(38,13)}
    <rect x="24.6" y="19" width="2.8" height="3" rx="1"/>
    <rect x="36.6" y="19" width="2.8" height="3" rx="1"/>
    <rect x="23.2" y="22" width="5.6" height="16" rx="2.8"/>
    <rect x="35.2" y="22" width="5.6" height="16" rx="2.8"/>
    <ellipse cx="26" cy="38.8" rx="6" ry="1.6"/>
    <ellipse cx="38" cy="38.8" rx="6" ry="1.6"/>
    <rect x="10" y="39" width="44" height="7" rx="3.5"/>
    <rect x="30" y="46" width="4" height="9"/>
    <rect x="22" y="55" width="20" height="5" rx="2.5"/>`,
};
const grid = document.getElementById('grid');
for (const [nombre, cuerpo] of Object.entries(conceptos)) {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<h2>${nombre}</h2>
    <div class="row">
      <div class="big"><svg width="92" height="92" viewBox="0 0 64 64" fill="${C}">${cuerpo}</svg></div>
      <div class="small">
        <svg width="40" height="40" viewBox="0 0 64 64" fill="${C}">${cuerpo}</svg>
        <svg width="16" height="16" viewBox="0 0 64 64" fill="${C}">${cuerpo}</svg>
        <span>40 · 16</span>
      </div>
    </div>
    <div style="margin-top:14px"><div class="tile"><svg width="72" height="72" viewBox="0 0 64 64" fill="${P}">${cuerpo}</svg></div></div>`;
  grid.appendChild(card);
}
</script>
</body>
</html>
