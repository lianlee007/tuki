<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="titulo-arquitectura">
  <title id="titulo-arquitectura">Arquitectura de la voz en el chat de Tuki</title>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A7E72"/>
    </marker>
    <marker id="flecha-terracota" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B85C38"/>
    </marker>
    <marker id="flecha-verde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2F7A58"/>
    </marker>
    <filter id="sombra" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#2D2A26" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1400" height="820" fill="#FBF6EA"/>
  <text x="50" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#2D2A26">Arquitectura de la voz en el chat</text>
  <text x="50" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#8A7E72">Dictado con Web Speech API, lectura con speechSynthesis y respuesta del chatbot con RAG local</text>

  <!-- Carril del navegador -->
  <rect x="38" y="108" width="680" height="660" rx="22" fill="#F6EEDF" stroke="#D9CDBE" stroke-width="1.5"/>
  <text x="62" y="138" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4" fill="#8A7E72">NAVEGADOR · CLIENTE</text>

  <!-- Usuario -->
  <g filter="url(#sombra)">
    <rect x="70" y="180" width="190" height="92" rx="16" fill="#FFFFFF" stroke="#D9CDBE"/>
    <rect x="70" y="180" width="6" height="92" rx="3" fill="#C9A227"/>
    <text x="92" y="214" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#2D2A26">Usuario</text>
    <text x="92" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8A7E72">habla y escucha</text>
  </g>

  <!-- Chat -->
  <g filter="url(#sombra)">
    <rect x="310" y="180" width="330" height="92" rx="16" fill="#FFFFFF" stroke="#B85C38" stroke-width="1.5"/>
    <rect x="310" y="180" width="6" height="92" rx="3" fill="#B85C38"/>
    <text x="334" y="214" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#2D2A26">ChatRecomendador</text>
    <text x="334" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8A7E72">historial, estados y burbujas</text>
  </g>

  <!-- API cliente -->
  <g filter="url(#sombra)">
    <rect x="310" y="300" width="330" height="64" rx="14" fill="#FFFFFF" stroke="#D9CDBE"/>
    <text x="334" y="326" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#2D2A26">apis.ia</text>
    <text x="410" y="326" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8A7E72">POST /api/v1/ai/recomendar</text>
    <text x="334" y="348" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8A7E72">contrato tipado de @tuki/api-cliente</text>
  </g>

  <!-- Dictado -->
  <g filter="url(#sombra)">
    <rect x="250" y="440" width="170" height="88" rx="14" fill="#FFFFFF" stroke="#D9CDBE"/>
    <rect x="250" y="440" width="6" height="88" rx="3" fill="#2F7A58"/>
    <text x="272" y="472" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#2D2A26">useDictadoVoz</text>
    <text x="272" y="494" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8A7E72">micrófono y parciales</text>
  </g>

  <!-- Lectura -->
  <g filter="url(#sombra)">
    <rect x="470" y="440" width="170" height="88" rx="14" fill="#FFFFFF" stroke="#D9CDBE"/>
    <rect x="470" y="440" width="6" height="88" rx="3" fill="#C9A227"/>
    <text x="492" y="472" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#2D2A26">useLecturaVoz</text>
    <text x="492" y="494" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8A7E72">voz y cola de lectura</text>
  </g>

  <!-- Web Speech -->
  <g filter="url(#sombra)">
    <rect x="250" y="578" width="170" height="82" rx="14" fill="#F6EEDF" stroke="#D9CDBE"/>
    <text x="272" y="608" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#2D2A26">Web Speech API</text>
    <text x="272" y="630" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8A7E72">STT del navegador</text>
  </g>

  <!-- Speech Synthesis -->
  <g filter="url(#sombra)">
    <rect x="470" y="578" width="170" height="82" rx="14" fill="#F6EEDF" stroke="#D9CDBE"/>
    <text x="492" y="608" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#2D2A26">speechSynthesis</text>
    <text x="492" y="630" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8A7E72">TTS del sistema</text>
  </g>

  <!-- Carril de servicios -->
  <rect x="744" y="108" width="618" height="660" rx="22" fill="#F6EEDF" stroke="#D9CDBE" stroke-width="1.5"/>
  <text x="768" y="138" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4" fill="#8A7E72">SERVICIOS TUKI · IA LOCAL</text>

  <!-- API Gateway -->
  <g filter="url(#sombra)">
    <rect x="776" y="180" width="210" height="92" rx="16" fill="#FFFFFF" stroke="#D9CDBE"/>
    <rect x="776" y="180" width="6" height="92" rx="3" fill="#6B7C93"/>
    <text x="800" y="214" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#2D2A26">API Gateway</text>
    <text x="800" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8A7E72">CORS, auth y proxy</text>
  </g>

  <!-- AI Gateway -->
  <g filter="url(#sombra)">
    <rect x="1040" y="180" width="290" height="92" rx="16" fill="#FFFFFF" stroke="#B85C38" stroke-width="1.5"/>
    <rect x="1040" y="180" width="6" height="92" rx="3" fill="#B85C38"/>
    <text x="1064" y="214" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#2D2A26">AI Gateway</text>
    <text x="1064" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8A7E72">FastAPI · orquestación RAG</text>
  </g>

  <!-- RAG -->
  <g filter="url(#sombra)">
    <rect x="776" y="376" width="210" height="100" rx="16" fill="#FFFFFF" stroke="#D9CDBE"/>
    <rect x="776" y="376" width="6" height="100" rx="3" fill="#2F7A58"/>
    <text x="800" y="410" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#2D2A26">Índice RAG</text>
    <text x="800" y="432" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8A7E72">catálogo + conocimiento</text>
    <text x="800" y="452" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8A7E72">BM25 + embeddings + MMR</text>
  </g>

  <!-- Ollama -->
  <g filter="url(#sombra)">
    <rect x="1040" y="376" width="290" height="100" rx="16" fill="#FFFFFF" stroke="#B85C38" stroke-width="1.5"/>
    <rect x="1040" y="376" width="6" height="100" rx="3" fill="#B85C38"/>
    <text x="1064" y="410" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#2D2A26">Ollama local</text>
    <text x="1064" y="432" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8A7E72">tuki-chef · 1.5B · Q4_K_M</text>
    <text x="1064" y="452" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8A7E72">nomic-embed-text · 137M</text>
  </g>

  <!-- Servicios -->
  <g filter="url(#sombra)">
    <rect x="776" y="548" width="210" height="86" rx="14" fill="#F6EEDF" stroke="#D9CDBE"/>
    <text x="800" y="578" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#2D2A26">restaurantes-service</text>
    <text x="800" y="600" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8A7E72">catálogo real</text>
  </g>
  <g filter="url(#sombra)">
    <rect x="1040" y="548" width="290" height="86" rx="14" fill="#F6EEDF" stroke="#D9CDBE"/>
    <text x="1064" y="578" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#2D2A26">resenas-service</text>
    <text x="1064" y="600" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8A7E72">valoraciones para el contexto</text>
  </g>

  <!-- Flechas de voz -->
  <path d="M 260 226 L 306 226" fill="none" stroke="#B85C38" stroke-width="2.2" marker-end="url(#flecha-terracota)"/>
  <text x="272" y="216" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#B85C38">voz</text>

  <path d="M 310 226 C 250 250 225 380 300 436" fill="none" stroke="#2F7A58" stroke-width="1.8" marker-end="url(#flecha-verde)"/>
  <text x="238" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#2F7A58">mic</text>

  <path d="M 640 226 C 700 250 710 380 590 436" fill="none" stroke="#C9A227" stroke-width="1.8" marker-end="url(#flecha)"/>
  <text x="686" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#C9A227">leer</text>

  <path d="M 335 528 L 335 574" fill="none" stroke="#2F7A58" stroke-width="1.8" marker-end="url(#flecha-verde)"/>
  <text x="341" y="556" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#2F7A58">audio</text>

  <path d="M 555 528 L 555 574" fill="none" stroke="#C9A227" stroke-width="1.8" marker-end="url(#flecha)"/>
  <text x="561" y="556" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#C9A227">texto</text>

  <path d="M 470 620 C 205 660 215 300 245 272" fill="none" stroke="#C9A227" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#flecha)"/>
  <text x="226" y="470" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#C9A227" transform="rotate(-78 226 470)">voz de respuesta</text>

  <!-- Flechas de red -->
  <path d="M 380 272 L 380 296" fill="none" stroke="#6B7C93" stroke-width="1.8" marker-end="url(#flecha)"/>
  <text x="386" y="288" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#6B7C93">mensaje</text>

  <path d="M 570 296 L 570 272" fill="none" stroke="#8A7E72" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#flecha)"/>
  <text x="576" y="288" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#8A7E72">burbuja</text>

  <path d="M 640 332 L 772 226" fill="none" stroke="#6B7C93" stroke-width="2" marker-end="url(#flecha)"/>
  <text x="680" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#6B7C93">HTTP</text>

  <path d="M 986 226 L 1036 226" fill="none" stroke="#6B7C93" stroke-width="2" marker-end="url(#flecha)"/>
  <text x="994" y="216" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#6B7C93">proxy</text>

  <path d="M 1080 272 C 1040 320 995 340 986 372" fill="none" stroke="#2F7A58" stroke-width="1.8" marker-end="url(#flecha-verde)"/>
  <text x="1015" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#2F7A58">consulta</text>

  <path d="M 1185 272 L 1185 372" fill="none" stroke="#B85C38" stroke-width="1.8" marker-end="url(#flecha-terracota)"/>
  <text x="1192" y="324" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#B85C38">prompt</text>

  <path d="M 870 476 L 870 544" fill="none" stroke="#2F7A58" stroke-width="1.6" marker-end="url(#flecha-verde)"/>
  <text x="876" y="512" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#2F7A58">lee</text>

  <path d="M 986 426 C 1020 450 1030 500 1080 544" fill="none" stroke="#2F7A58" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#flecha-verde)"/>
  <text x="1000" y="500" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#2F7A58">valoraciones</text>

  <path d="M 1280 372 L 1280 272" fill="none" stroke="#B85C38" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#flecha-terracota)"/>
  <text x="1288" y="324" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#B85C38">respuesta</text>

  <!-- Retorno -->
  <path d="M 776 250 L 644 250" fill="none" stroke="#8A7E72" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#flecha)"/>
  <text x="700" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#8A7E72">respuesta</text>

  <!-- Leyenda -->
  <rect x="50" y="792" width="14" height="4" rx="2" fill="#B85C38"/>
  <text x="72" y="797" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#8A7E72">flujo principal</text>
  <rect x="180" y="792" width="14" height="4" rx="2" fill="#8A7E72"/>
  <text x="202" y="797" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#8A7E72">retorno de la respuesta</text>
  <rect x="360" y="792" width="14" height="4" rx="2" fill="#C9A227"/>
  <text x="382" y="797" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#8A7E72">audio de salida</text>
</svg>
