[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tuki-ai-gateway"
version = "1.0.0"
description = "AI Gateway de Tuki: RAG local con Ollama sobre el catálogo de restaurantes."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest no añade la raíz del proyecto al path: sin esto, `import app` falla en
# CI, donde el paquete no se instala en el entorno.
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
ignore = ["B008"]
