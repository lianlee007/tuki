# =============================================================================
# Catálogo mínimo de Backstage para Tuki.
#
# Este archivo se puede registrar tal cual en un Backstage existente:
#   Catalog → Locations → Add location → URL del archivo en el repositorio.
#
# No requiere que Backstage esté instalado para ser útil: documenta el modelo
# de dominio, sistema, componentes, recursos, dependencias y propietario.
#
# Anotaciones usadas:
#   - backstage.io/kubernetes-id: nombre del Deployment/Service en el clúster.
#   - backstage.io/kubernetes-namespace: namespace de Tuki.
#   - github.com/project-slug: repositorio para el plugin de GitHub.
# =============================================================================

apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: tuki-team
  description: Equipo responsable del producto Tuki, su plataforma y su operación.
spec:
  type: team
  profile:
    displayName: Equipo Tuki
  children: []

---
apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: tuki
  description: Dominio de menús digitales y presencia web para restaurantes.
spec:
  owner: tuki-team

---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: tuki
  description: "Sistema completo de Tuki: SPA pública, panel de restaurante, API gestionada y AI Gateway."
  links:
    - url: https://github.com/lianlee007/tuki
      title: Repositorio
      icon: github
    - url: https://github.com/lianlee007/tuki/blob/main/deploy/README.md
      title: Guía de despliegue
      icon: docs
spec:
  owner: tuki-team
  domain: tuki

---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: supabase
  description: Postgres, autenticación, RLS y JWKS del proyecto. Servicio gestionado.
  links:
    - url: https://supabase.com
      title: Supabase
      icon: cloud
spec:
  type: database
  owner: tuki-team
  system: tuki

---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: supabase-storage
  description: Buckets de imágenes de platillos, restaurantes y reseñas. Servicio gestionado.
  links:
    - url: https://supabase.com/docs/guides/storage
      title: Supabase Storage
      icon: cloud
spec:
  type: object-storage
  owner: tuki-team
  system: tuki

---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: groq
  description: Proveedor externo de inferencia de texto usado por el AI Gateway.
  links:
    - url: https://groq.com
      title: Groq
      icon: cloud
spec:
  type: external-api
  owner: tuki-team
  system: tuki

---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: tuki-web
  description: SPA React/Vite servida por Nginx; incluye la landing, el panel del restaurante y las vistas públicas.
  annotations:
    backstage.io/kubernetes-id: tuki
    backstage.io/kubernetes-namespace: tuki
    github.com/project-slug: lianlee007/tuki
  tags:
    - react
    - vite
    - nginx
    - spa
  links:
    - url: https://github.com/lianlee007/tuki
      title: Código fuente
      icon: github
    - url: https://github.com/lianlee007/tuki/blob/main/deploy/README.md
      title: Despliegue
      icon: docs
    - url: https://github.com/lianlee007/tuki/blob/main/docs/runbook.md
      title: Runbook
      icon: docs
spec:
  type: website
  lifecycle: production
  owner: tuki-team
  system: tuki
  dependsOn:
    - resource:supabase
    - resource:supabase-storage
    - component:tuki-ai-gateway

---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: tuki-ai-gateway
  description: Gateway FastAPI que valida JWT de Supabase, aplica cuotas y llama a Groq sin exponer la clave.
  annotations:
    backstage.io/kubernetes-id: tuki-ai-gateway
    backstage.io/kubernetes-namespace: tuki
    github.com/project-slug: lianlee007/tuki
  tags:
    - fastapi
    - python
    - ai-gateway
    - security
  links:
    - url: https://github.com/lianlee007/tuki/tree/main/services/ai-gateway
      title: Código fuente
      icon: github
    - url: https://github.com/lianlee007/tuki/blob/main/docs/adr/0001-ai-gateway.md
      title: ADR del gateway
      icon: docs
    - url: https://github.com/lianlee007/tuki/blob/main/docs/security/modelo-de-amenazas.md
      title: Modelo de amenazas
      icon: docs
  dependsOn:
    - resource:supabase
    - resource:groq
spec:
  type: service
  lifecycle: production
  owner: tuki-team
  system: tuki
