# Ejemplo de secretos para el laboratorio.
# En producción se reemplaza por Sealed Secrets o External Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: tuki-secrets
  namespace: tuki
type: Opaque
stringData:
  jwt-secreto: cambio-este-secreto-en-produccion-32
  postgres-password: tuki_admin_dev
  minio-root-user: tuki_minio
  minio-root-password: tuki_minio_dev
  identidad-database-url: postgres://tuki_identidad:tuki_identidad_dev@postgres:5432/tuki_identidad
  restaurantes-database-url: postgres://tuki_restaurantes:tuki_restaurantes_dev@postgres:5432/tuki_restaurantes
  media-database-url: postgres://tuki_media:tuki_media_dev@postgres:5432/tuki_media
  pedidos-database-url: postgres://tuki_pedidos:tuki_pedidos_dev@postgres:5432/tuki_pedidos
  resenas-database-url: postgres://tuki_resenas:tuki_resenas_dev@postgres:5432/tuki_resenas
  s3-access-key: tuki_minio
  s3-secret-key: tuki_minio_dev
  superadmin-email: admin@tuki.example.com
  superadmin-password: Admin12345
