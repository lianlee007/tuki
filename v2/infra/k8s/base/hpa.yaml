apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: restaurantes-service
  namespace: tukituki
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: restaurantes-service
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
