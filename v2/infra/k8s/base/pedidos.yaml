apiVersion: apps/v1
kind: Deployment
metadata:
  name: pedidos-service
  namespace: tukituki
  labels:
    app: pedidos-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pedidos-service
  template:
    metadata:
      labels:
        app: pedidos-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: migrar
          image: ghcr.io/lianlee007/tukituki-pedidos:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/db/migrar.js"]
          envFrom:
            - configMapRef:
                name: tukituki-config
          env:
            - name: JWT_SECRETO
              valueFrom:
                secretKeyRef:
                  name: tukituki-secrets
                  key: jwt-secreto
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tukituki-secrets
                  key: pedidos-database-url
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: pedidos
          image: ghcr.io/lianlee007/tukituki-pedidos:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3004
          envFrom:
            - configMapRef:
                name: tukituki-config
          env:
            - name: PUERTO
              value: "3004"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tukituki-secrets
                  key: pedidos-database-url
            - name: JWT_SECRETO
              valueFrom:
                secretKeyRef:
                  name: tukituki-secrets
                  key: jwt-secreto
          readinessProbe:
            httpGet:
              path: /listo
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /salud
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 400m
              memory: 320Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pedidos-service
  namespace: tukituki
  labels:
    app: pedidos-service
spec:
  selector:
    app: pedidos-service
  ports:
    - name: http
      port: 3004
      targetPort: http
