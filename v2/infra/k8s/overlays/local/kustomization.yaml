apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# El clúster de escritorio ya puede tener el despliegue legacy en `tuki`;
# v2 usa un namespace propio para no pisarlo.
namespace: tuki-v2
resources:
  - ../../base
images:
  - name: ghcr.io/lianlee007/tuki-v2-identidad
    newTag: local
  - name: ghcr.io/lianlee007/tuki-v2-restaurantes
    newTag: local
  - name: ghcr.io/lianlee007/tuki-v2-media
    newTag: local
  - name: ghcr.io/lianlee007/tuki-v2-pedidos
    newTag: local
  - name: ghcr.io/lianlee007/tuki-v2-resenas
    newTag: local
  - name: ghcr.io/lianlee007/tuki-v2-admin-service
    newTag: local
  - name: ghcr.io/lianlee007/tuki-v2-ai-gateway
    newTag: local
  - name: ghcr.io/lianlee007/tuki-v2-web-comensal
    newTag: local
  - name: ghcr.io/lianlee007/tuki-v2-panel
    newTag: local
  - name: ghcr.io/lianlee007/tuki-v2-admin
    newTag: local
replicas:
  - name: restaurantes-service
    count: 1
  - name: pedidos-service
    count: 1
  - name: web-comensal
    count: 1
