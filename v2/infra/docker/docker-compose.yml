name: tuki-v2

# Infraestructura local de Tuki v2.
# Levanta las dependencias compartidas y el primer microservicio.
# Uso: docker compose -f infra/docker/docker-compose.yml up -d --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: tuki-v2-postgres
    environment:
      POSTGRES_USER: tuki_admin
      POSTGRES_PASSWORD: tuki_admin_dev
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tuki_admin -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tuki-v2-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: tuki-v2-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tuki_minio
      MINIO_ROOT_PASSWORD: tuki_minio_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: tuki-v2-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

  traefik:
    image: traefik:v3.1
    container_name: tuki-v2-traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  identidad-service:
    build:
      context: ../..
      dockerfile: services/identidad-service/Dockerfile
    container_name: tuki-v2-identidad
    environment:
      NODE_ENV: development
      PUERTO: "3001"
      DATABASE_URL: postgres://tuki_identidad:tuki_identidad_dev@postgres:5432/tuki_identidad
      JWT_SECRETO: cambio-este-secreto-en-produccion
      JWT_EMISOR: tuki-identidad
      JWT_AUDIENCIA: tuki
      CORS_ORIGENES: http://localhost:5173,http://localhost:5174,http://localhost:5175
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.identidad.rule=Host(`identidad.tuki.local`)"
      - "traefik.http.services.identidad.loadbalancer.server.port=3001"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
