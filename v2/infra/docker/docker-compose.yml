name: tuki-v2

# Infraestructura local de Tuki v2.
# Levanta las dependencias compartidas y el primer microservicio.
# Uso: docker compose -f infra/docker/docker-compose.yml up -d --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: tuki-v2-postgres
    environment:
      POSTGRES_USER: tuki_admin
      POSTGRES_PASSWORD: tuki_admin_dev
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tuki_admin -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tuki-v2-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: tuki-v2-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tuki_minio
      MINIO_ROOT_PASSWORD: tuki_minio_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: tuki-v2-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

  traefik:
    image: traefik:v3.1
    container_name: tuki-v2-traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  identidad-service:
    build:
      context: ../..
      dockerfile: services/identidad-service/Dockerfile
    container_name: tuki-v2-identidad
    environment:
      NODE_ENV: development
      PUERTO: "3001"
      DATABASE_URL: postgres://tuki_identidad:tuki_identidad_dev@postgres:5432/tuki_identidad
      JWT_SECRETO: cambio-este-secreto-en-produccion
      JWT_EMISOR: tuki-identidad
      JWT_AUDIENCIA: tuki
      CORS_ORIGENES: http://localhost:5173,http://localhost:5174,http://localhost:5175
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.identidad.rule=Host(`identidad.tuki.local`)"
      - "traefik.http.services.identidad.loadbalancer.server.port=3001"
    restart: unless-stopped

  restaurantes-service:
    build:
      context: ../..
      dockerfile: services/restaurantes-service/Dockerfile
    container_name: tuki-v2-restaurantes
    environment:
      NODE_ENV: development
      PUERTO: "3002"
      DATABASE_URL: postgres://tuki_restaurantes:tuki_restaurantes_dev@postgres:5432/tuki_restaurantes
      JWT_SECRETO: cambio-este-secreto-en-produccion
      JWT_EMISOR: tuki-identidad
      JWT_AUDIENCIA: tuki
      CORS_ORIGENES: http://localhost:5173,http://localhost:5174,http://localhost:5175
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.restaurantes.rule=Host(`restaurantes.tuki.local`)"
      - "traefik.http.services.restaurantes.loadbalancer.server.port=3002"
    restart: unless-stopped

  media-service:
    build:
      context: ../..
      dockerfile: services/media-service/Dockerfile
    container_name: tuki-v2-media
    environment:
      NODE_ENV: development
      PUERTO: "3003"
      DATABASE_URL: postgres://tuki_media:tuki_media_dev@postgres:5432/tuki_media
      JWT_SECRETO: cambio-este-secreto-en-produccion
      JWT_EMISOR: tuki-identidad
      JWT_AUDIENCIA: tuki
      CORS_ORIGENES: http://localhost:5173,http://localhost:5174,http://localhost:5175
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: tuki-media
      S3_ACCESS_KEY: tuki_minio
      S3_SECRET_KEY: tuki_minio_dev
      S3_PUBLIC_URL: http://localhost:9000/tuki-media
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.media.rule=Host(`media.tuki.local`)"
      - "traefik.http.services.media.loadbalancer.server.port=3003"
    restart: unless-stopped

  pedidos-service:
    build:
      context: ../..
      dockerfile: services/pedidos-service/Dockerfile
    container_name: tuki-v2-pedidos
    environment:
      NODE_ENV: development
      PUERTO: "3004"
      DATABASE_URL: postgres://tuki_pedidos:tuki_pedidos_dev@postgres:5432/tuki_pedidos
      JWT_SECRETO: cambio-este-secreto-en-produccion
      JWT_EMISOR: tuki-identidad
      JWT_AUDIENCIA: tuki
      RESTAURANTES_URL: http://restaurantes-service:3002
      CORS_ORIGENES: http://localhost:5173,http://localhost:5174,http://localhost:5175
    ports:
      - "3004:3004"
    depends_on:
      postgres:
        condition: service_healthy
      restaurantes-service:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pedidos.rule=Host(`pedidos.tuki.local`)"
      - "traefik.http.services.pedidos.loadbalancer.server.port=3004"
    restart: unless-stopped

  resenas-service:
    build:
      context: ../..
      dockerfile: services/resenas-service/Dockerfile
    container_name: tuki-v2-resenas
    environment:
      NODE_ENV: development
      PUERTO: "3005"
      DATABASE_URL: postgres://tuki_resenas:tuki_resenas_dev@postgres:5432/tuki_resenas
      JWT_SECRETO: cambio-este-secreto-en-produccion
      JWT_EMISOR: tuki-identidad
      JWT_AUDIENCIA: tuki
      RESTAURANTES_URL: http://restaurantes-service:3002
      CORS_ORIGENES: http://localhost:5173,http://localhost:5174,http://localhost:5175
    ports:
      - "3005:3005"
    depends_on:
      postgres:
        condition: service_healthy
      restaurantes-service:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.resenas.rule=Host(`resenas.tuki.local`)"
      - "traefik.http.services.resenas.loadbalancer.server.port=3005"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
