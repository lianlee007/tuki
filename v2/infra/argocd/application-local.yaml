apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tuki-v2-local
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/lianlee007/Tuki.git
    targetRevision: feat/migracion-microservicios-desarrollo
    path: v2/infra/k8s/overlays/local
  destination:
    server: https://kubernetes.default.svc
    namespace: tuki
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
