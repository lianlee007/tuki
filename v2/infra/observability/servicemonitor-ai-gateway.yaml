apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: tukituki-ai-gateway
  namespace: tukituki
  labels:
    app.kubernetes.io/part-of: tukituki
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - tukituki
  selector:
    matchLabels:
      app: ai-gateway
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
