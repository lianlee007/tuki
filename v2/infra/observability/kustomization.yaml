apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tuki
resources:
  - servicemonitor-ai-gateway.yaml
  - prometheusrule.yaml
configMapGenerator:
  - name: tuki-grafana-dashboard
    files:
      - dashboards/tuki-overview.json
    options:
      labels:
        grafana_dashboard: "1"
        app.kubernetes.io/part-of: tuki
generatorOptions:
  disableNameSuffixHash: true
