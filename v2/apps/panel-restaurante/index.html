<!doctype html>
<html lang="es" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TukiTuki - Panel del restaurante</title>
    <meta
      name="description"
      content="Administra el menú, el tema, los pedidos y las reseñas de tu restaurante."
    />
    <script>
      try {
        var modoGuardado = localStorage.getItem('tema');
        if (modoGuardado === 'dark' || modoGuardado === 'light') {
          document.documentElement.classList.add(modoGuardado);
        }
      } catch (e) {
        /* sin localStorage: se queda en claro */
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Playfair+Display:wght@400;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script src="/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
