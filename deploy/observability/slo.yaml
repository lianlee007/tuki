apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: tuki-slo
  labels:
    app.kubernetes.io/part-of: tuki
    release: kube-prometheus-stack
spec:
  groups:
    # -------------------------------------------------------------------------
    # SLI: proporción de peticiones buenas.
    # Ventanas corta y larga para distinguir un pico de una degradación real.
    # -------------------------------------------------------------------------
    - name: tuki.sli
      interval: 30s
      rules:
        - record: tuki:sli_disponibilidad:ratio5m
          expr: |
            sum(rate(ai_gateway_http_requests_total{status!~"5.."}[5m]))
            /
            clamp_min(sum(rate(ai_gateway_http_requests_total[5m])), 0.001)

        - record: tuki:sli_disponibilidad:ratio1h
          expr: |
            sum(rate(ai_gateway_http_requests_total{status!~"5.."}[1h]))
            /
            clamp_min(sum(rate(ai_gateway_http_requests_total[1h])), 0.001)

        - record: tuki:sli_disponibilidad:ratio6h
          expr: |
            sum(rate(ai_gateway_http_requests_total{status!~"5.."}[6h]))
            /
            clamp_min(sum(rate(ai_gateway_http_requests_total[6h])), 0.001)

        # Latencia: fracción de peticiones que terminan en menos de 8 s.
        # Groq es el proveedor; 8 s deja margen al timeout de 30 s.
        - record: tuki:sli_latencia:ratio1h
          expr: |
            sum(rate(ai_gateway_http_request_duration_seconds_bucket{le="8"}[1h]))
            /
            clamp_min(sum(rate(ai_gateway_http_request_duration_seconds_count[1h])), 0.001)

        - record: tuki:sli_latencia:ratio5m
          expr: |
            sum(rate(ai_gateway_http_request_duration_seconds_bucket{le="8"}[5m]))
            /
            clamp_min(sum(rate(ai_gateway_http_request_duration_seconds_count[5m])), 0.001)

        # Disponibilidad de la SPA medida desde Prometheus (scrape de Nginx).
        - record: tuki:sli_web:ratio5m
          expr: avg_over_time(up{namespace="tuki",service="tuki"}[5m])

    # -------------------------------------------------------------------------
    # Alertas de quema del error budget (multiventana).
    #
    # SLO de disponibilidad 99,5 % ⇒ budget 0,5 % mensual.
    #   quema 14,4x en 1 h  ⇒ se agota el mes en ~2 días  (page)
    #   quema 6x en 6 h      ⇒ se agota el mes en ~5 días  (ticket)
    # -------------------------------------------------------------------------
    - name: tuki.slo
      rules:
        - alert: TukiSloDisponibilidadQuemaRapida
          expr: |
            (1 - tuki:sli_disponibilidad:ratio1h) > (14.4 * 0.005)
            and
            (1 - tuki:sli_disponibilidad:ratio5m) > (14.4 * 0.005)
          for: 2m
          labels:
            severity: critical
            team: tuki
            slo: disponibilidad
          annotations:
            summary: "El error budget de disponibilidad se agota en ~2 días"
            description: "Quema >14,4x sobre el objetivo 99,5 %. Revisa 5xx del gateway, Groq y el túnel de Cloudflare."
            runbook_url: "https://github.com/lianlee007/tuki/blob/main/docs/runbook.md#errores-5xx-en-el-gateway"

        - alert: TukiSloDisponibilidadQuemaLenta
          expr: |
            (1 - tuki:sli_disponibilidad:ratio6h) > (6 * 0.005)
            and
            (1 - tuki:sli_disponibilidad:ratio1h) > (6 * 0.005)
          for: 15m
          labels:
            severity: warning
            team: tuki
            slo: disponibilidad
          annotations:
            summary: "Degradación sostenida de disponibilidad (quema 6x)"
            description: "El objetivo 99,5 % se agotaría en ~5 días. No es un pico: investiga la causa raíz."
            runbook_url: "https://github.com/lianlee007/tuki/blob/main/docs/runbook.md#errores-5xx-en-el-gateway"

        - alert: TukiSloLatenciaQuemaRapida
          expr: |
            (1 - tuki:sli_latencia:ratio1h) > (14.4 * 0.05)
            and
            (1 - tuki:sli_latencia:ratio5m) > (14.4 * 0.05)
          for: 10m
          labels:
            severity: warning
            team: tuki
            slo: latencia
          annotations:
            summary: "Más del 5 % de peticiones tardan más de 8 s"
            description: "SLO de latencia 95 % < 8 s. Mira ai_gateway_upstream_duration_seconds y el estado de Groq."
            runbook_url: "https://github.com/lianlee007/tuki/blob/main/docs/runbook.md#latencia-alta"

        - alert: TukiSloWebSinPresupuesto
          expr: tuki:sli_web:ratio5m < 0.995
          for: 10m
          labels:
            severity: critical
            team: tuki
            slo: web
          annotations:
            summary: "La SPA lleva 10 min por debajo del 99,5 % de disponibilidad"
            description: "Prometheus no puede scrapear el Service tuki. Comprueba pods, Ingress y túnel."
            runbook_url: "https://github.com/lianlee007/tuki/blob/main/docs/runbook.md#spa-caida"
