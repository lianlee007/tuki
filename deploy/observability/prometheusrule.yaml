apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: tuki-alertas
  labels:
    app.kubernetes.io/part-of: tuki
    release: kube-prometheus-stack
spec:
  groups:
    - name: tuki.disponibilidad
      rules:
        - alert: TukiWebDown
          expr: up{namespace="tuki",service="tuki"} == 0
          for: 5m
          labels:
            severity: critical
            team: tuki
          annotations:
            summary: "La SPA de Tuki no responde"
            description: "Prometheus no puede hacer scrape del exporter de Nginx en el Service tuki desde hace 5 minutos."
            runbook_url: "https://github.com/lianlee007/tuki/blob/main/docs/runbook.md#spa-caida"

        - alert: TukiGatewayDown
          expr: up{namespace="tuki",service="backend"} == 0
          for: 5m
          labels:
            severity: critical
            team: tuki
          annotations:
            summary: "El AI Gateway no responde"
            description: "Sin gateway, las funciones de IA fallan. Revisa pods, logs y el secreto de Groq."
            runbook_url: "https://github.com/lianlee007/tuki/blob/main/docs/runbook.md#gateway-caido"

    - name: tuki.calidad
      rules:
        - alert: TukiGatewayErrorRate
          expr: |
            (
              sum(rate(ai_gateway_http_requests_total{status=~"5.."}[5m]))
              /
              clamp_min(sum(rate(ai_gateway_http_requests_total[5m])), 0.001)
            ) > 0.05
          for: 10m
          labels:
            severity: warning
            team: tuki
          annotations:
            summary: "Más del 5 % de peticiones al gateway fallan"
            description: "Revisa Groq, timeouts y logs JSON del gateway (campo code)."
            runbook_url: "https://github.com/lianlee007/tuki/blob/main/docs/runbook.md#errores-5xx-en-el-gateway"

        - alert: TukiGatewayLatencyHigh
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (rate(ai_gateway_http_request_duration_seconds_bucket[5m]))
            ) > 10
          for: 10m
          labels:
            severity: warning
            team: tuki
          annotations:
            summary: "Latencia p95 del gateway por encima de 10 s"
            description: "Puede ser degradación de Groq o saturación del pod. Revisa ai_gateway_upstream_duration_seconds."
            runbook_url: "https://github.com/lianlee007/tuki/blob/main/docs/runbook.md#latencia-alta"

        - alert: TukiGatewayRateLimitAbuse
          expr: sum(rate(ai_gateway_rate_limited_total[5m])) > 1
          for: 10m
          labels:
            severity: warning
            team: tuki
          annotations:
            summary: "Muchas peticiones rechazadas por rate limit"
            description: "Puede ser abuso anónimo o una cuota demasiado baja. Revisa la IP y ajusta AI_RATE_LIMIT_*."
            runbook_url: "https://github.com/lianlee007/tuki/blob/main/docs/runbook.md#rate-limit"

        - alert: TukiGatewayTimeouts
          expr: sum(rate(ai_gateway_http_requests_total{status="504"}[5m])) > 0.2
          for: 10m
          labels:
            severity: warning
            team: tuki
          annotations:
            summary: "Timeouts frecuentes en el AI Gateway"
            description: "Groq está tardando más que AI_GROQ_TOTAL_TIMEOUT_SECONDS. Considera bajar el timeout o el número de reintentos."
            runbook_url: "https://github.com/lianlee007/tuki/blob/main/docs/runbook.md#timeouts"

        - alert: TukiNginxConnectionsHigh
          expr: sum(nginx_connections_active{namespace="tuki"}) > 800
          for: 10m
          labels:
            severity: warning
            team: tuki
          annotations:
            summary: "Nginx con más de 800 conexiones activas"
            description: "Revisa worker_connections, HPA y latencia del gateway."
            runbook_url: "https://github.com/lianlee007/tuki/blob/main/docs/runbook.md#nginx"
