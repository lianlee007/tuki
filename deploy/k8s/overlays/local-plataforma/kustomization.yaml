apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Overlay de laboratorio COMPLETO: a diferencia de `local`, asume que el
# clúster ya tiene ingress-nginx y metrics-server (ver
# deploy/scripts/demo-plataforma.sh). Sirve para demostrar en runtime lo que
# `local` solo puede declarar: Ingress, HPA, PDB y NetworkPolicy.
#
# Uso:
#   kubectl apply -k deploy/k8s/overlays/local-plataforma
#   kubectl -n riki get ingress,hpa
#   curl -H 'Host: riki.localhost' http://localhost/healthz
namespace: riki

resources:
  - ../../base

images:
  - name: ghcr.io/leonardo007x/leefood
    newName: riki
    newTag: local-0.2.0
  - name: ghcr.io/leonardo007x/riki-ai-gateway
    newName: riki-ai-gateway
    newTag: local-0.2.0

replicas:
  - name: riki
    count: 1
  - name: riki-ai-gateway
    count: 1

patches:
  # El Ingress de producción usa TLS con un certificado emitido fuera del
  # repositorio. En laboratorio se sirve HTTP sobre un host local.
  - target:
      kind: Ingress
      name: riki
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: riki.localhost
      - op: remove
        path: /spec/tls

  # En local no hay Supabase JWKS: se confía en la red del clúster y la cuota
  # por IP. Nunca uses este modo en producción.
  - target:
      kind: ConfigMap
      name: ai-gateway-config
    patch: |-
      - op: replace
        path: /data/AI_AUTH_MODE
        value: disabled
      - op: replace
        path: /data/AI_ENVIRONMENT
        value: development
      - op: replace
        path: /data/AI_LOG_LEVEL
        value: INFO
