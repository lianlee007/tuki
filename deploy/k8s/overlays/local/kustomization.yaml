apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Overlay para Docker Desktop, kind o k3d.
#
# A diferencia de producción:
#   - usa las imágenes locales `tuki:local-0.3.0` y
#     `tuki-ai-gateway:local-0.3.0`;
#   - deja los Services como ClusterIP y se accede con `kubectl port-forward`;
#   - deja fuera Ingress, HPA, PDB y NetworkPolicy, porque dependen de
#     controladores (ingress-nginx, metrics-server, CNI con políticas) que un
#     clúster de desarrollo no trae por defecto;
#   - desactiva la validación JWT (`AI_AUTH_MODE=disabled`).
#
# Antes de aplicar, crea el secreto del gateway:
#   kubectl create namespace tuki --dry-run=client -o yaml | kubectl apply -f -
#   kubectl create secret generic tuki-ai-gateway \
#     --from-literal=GROQ_API_KEY="$GROQ_API_KEY" -n tuki
#
# Uso:
#   docker build ... -t tuki:local-0.3.0 .
#   docker build -t tuki-ai-gateway:local-0.3.0 services/ai-gateway
#   kubectl apply -k deploy/k8s/overlays/local
#   kubectl port-forward -n tuki svc/tuki 8080:80
#   kubectl port-forward -n tuki svc/backend 8001:8000
#   curl http://localhost:8080/healthz
#   curl http://localhost:8080/api/healthz
namespace: tuki

resources:
  - ../../base

images:
  - name: ghcr.io/lianlee007/tuki
    newName: tuki
    newTag: local-0.3.0
  - name: ghcr.io/lianlee007/tuki-ai-gateway
    newName: tuki-ai-gateway
    newTag: local-0.3.0

replicas:
  - name: tuki
    count: 1
  - name: tuki-ai-gateway
    count: 1

patches:
  # Recursos que no aplican en un clúster de desarrollo sin controladores.
  - target:
      kind: Ingress
      name: tuki
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: tuki

  - target:
      kind: HorizontalPodAutoscaler
      name: tuki
    patch: |-
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: tuki

  - target:
      kind: HorizontalPodAutoscaler
      name: tuki-ai-gateway
    patch: |-
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: tuki-ai-gateway

  - target:
      kind: PodDisruptionBudget
      name: tuki
    patch: |-
      $patch: delete
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: tuki

  - target:
      kind: PodDisruptionBudget
      name: tuki-ai-gateway
    patch: |-
      $patch: delete
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: tuki-ai-gateway

  - target:
      kind: NetworkPolicy
      name: tuki-web
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: tuki-web

  - target:
      kind: NetworkPolicy
      name: tuki-ai-gateway
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: tuki-ai-gateway

  # En local no hay Supabase JWKS: se confía en la red del clúster y la cuota
  # por IP. Nunca uses este modo en producción.
  - target:
      kind: ConfigMap
      name: ai-gateway-config
    patch: |-
      - op: replace
        path: /data/AI_AUTH_MODE
        value: disabled
      - op: replace
        path: /data/AI_ENVIRONMENT
        value: development
      - op: replace
        path: /data/AI_LOG_LEVEL
        value: INFO
