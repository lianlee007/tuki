apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Overlay de producción. Antes de aplicarlo:
#   1. Reemplaza `ghcr.io/lianlee007/...` por tus imágenes reales.
#   2. Define el tag que quieres desplegar.
#   3. Cambia `tuki.app` por tu dominio en el patch del Ingress.
#   4. Ajusta el ClusterIssuer de cert-manager si usas otro nombre.
#   5. Reemplaza `SUPABASE_URL` por la URL real del proyecto.
#   6. Crea el secreto `tuki-ai-gateway` (ver deploy/k8s/base/ai-gateway-secret.example.yaml).
namespace: tuki

resources:
  - ../../base

images:
  - name: ghcr.io/lianlee007/tuki
    newName: ghcr.io/lianlee007/tuki
    newTag: "0.1.0"
  - name: ghcr.io/lianlee007/tuki-ai-gateway
    newName: ghcr.io/lianlee007/tuki-ai-gateway
    newTag: "0.1.0"
  - name: ghcr.io/lianlee007/tuki-vision
    newName: ghcr.io/lianlee007/tuki-vision
    newTag: "0.1.0"

patches:
  - target:
      kind: Ingress
      name: tuki
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          cert-manager.io/cluster-issuer: letsencrypt-prod
          nginx.ingress.kubernetes.io/proxy-body-size: "10m"
          nginx.ingress.kubernetes.io/proxy-connect-timeout: "5"
          nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
          nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
      - op: replace
        path: /spec/rules/0/host
        value: tuki.app
      - op: replace
        path: /spec/tls/0/hosts/0
        value: tuki.app

  - target:
      kind: HorizontalPodAutoscaler
      name: tuki
    patch: |-
      - op: replace
        path: /spec/maxReplicas
        value: 20

  - target:
      kind: Deployment
      name: tuki-ai-gateway
    patch: |-
      # El limitador es por pod: 1 réplica mantiene la cuota exacta mientras no
      # haya un almacén compartido. Ver docs/arquitectura/rate-limit.md.
      - op: replace
        path: /spec/replicas
        value: 1

  - target:
      kind: ConfigMap
      name: ai-gateway-config
    patch: |-
      - op: replace
        path: /data/AI_ENVIRONMENT
        value: production
      - op: replace
        path: /data/AI_AUTH_MODE
        value: supabase
      - op: replace
        path: /data/SUPABASE_URL
        value: https://TU_PROYECTO.supabase.co
