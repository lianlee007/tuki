apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Overlay de producción: la ÚNICA fuente de verdad de lo que corre en el clúster.
#
# Qué hace: fija el namespace, el tag de las dos imágenes y los parches de
# Ingress. ArgoCD vigila este archivo; al cambiar el `newTag` y hacer merge,
# sincroniza y el clúster converge. Nadie aplica `kubectl` a mano.
#
# Cómo se promueve:
#   1. Se publica un tag `vX.Y.Z`, el CI construye y firma `vX.Y.Z` en GHCR.
#   2. El workflow `promover.yml` verifica la firma y abre un PR que cambia
#      estos `newTag`.
#   3. Al mergear el PR, ArgoCD sincroniza. Revisa el diff antes de aprobar.
#
# Qué revisar antes de mergear:
#   - Que `newTag` exista en GHCR y esté firmado (lo verifica el workflow).
#   - Que el Ingress apunte al host real y al ClusterIssuer correcto.
#   - Que el secreto `tuki-ai-gateway` exista en el namespace.
namespace: tuki

resources:
  - ../../base

images:
  # `sha-379e41d` es la última imagen firmada y verificada (CI del 2026-11-03).
  # El primer release (`v0.1.0`) llega por el PR que abre `promover.yml`.
  - name: ghcr.io/lianlee007/tuki
    newName: ghcr.io/lianlee007/tuki
    newTag: "v0.1.0"
  - name: ghcr.io/lianlee007/tuki-ai-gateway
    newName: ghcr.io/lianlee007/tuki-ai-gateway
    newTag: "v0.1.0"

patches:
  - target:
      kind: Ingress
      name: tuki
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          cert-manager.io/cluster-issuer: letsencrypt-prod
          nginx.ingress.kubernetes.io/proxy-body-size: "64k"
          nginx.ingress.kubernetes.io/proxy-connect-timeout: "5"
          nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
          nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
      - op: replace
        path: /spec/rules/0/host
        value: tuki.app
      - op: replace
        path: /spec/tls/0/hosts/0
        value: tuki.app

  - target:
      kind: HorizontalPodAutoscaler
      name: tuki
    patch: |-
      - op: replace
        path: /spec/maxReplicas
        value: 20

  - target:
      kind: Deployment
      name: tuki-ai-gateway
    patch: |-
      # El limitador es por pod: 1 réplica mantiene la cuota exacta mientras no
      # haya un almacén compartido. Ver docs/arquitectura/rate-limit.md.
      - op: replace
        path: /spec/replicas
        value: 1

  - target:
      kind: ConfigMap
      name: ai-gateway-config
    patch: |-
      - op: replace
        path: /data/AI_ENVIRONMENT
        value: production
      - op: replace
        path: /data/AI_AUTH_MODE
        value: supabase
      - op: replace
        path: /data/SUPABASE_URL
        value: https://TU_PROYECTO.supabase.co
