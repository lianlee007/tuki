apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tuki-ai-gateway
  labels:
    app.kubernetes.io/name: tuki-ai-gateway
    app.kubernetes.io/component: ai-gateway
    app.kubernetes.io/part-of: tuki
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tuki-ai-gateway
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Max
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
