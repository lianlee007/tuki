# Plantilla del secreto del AI Gateway.
#
# NO se incluye en Kustomize: el secreto real se crea fuera de Git.
#   kubectl create secret generic tuki-ai-gateway \
#     --from-literal=GROQ_API_KEY='gsk_...' \
#     -n tuki
#
# Para GitOps, usa Sealed Secrets, External Secrets Operator o SOPS.
apiVersion: v1
kind: Secret
metadata:
  name: tuki-ai-gateway
  labels:
    app.kubernetes.io/name: tuki-ai-gateway
    app.kubernetes.io/component: ai-gateway
    app.kubernetes.io/part-of: tuki
type: Opaque
stringData:
  GROQ_API_KEY: "REEMPLAZA_CON_TU_CLAVE"
