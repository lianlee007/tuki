apiVersion: v1
kind: Service
metadata:
  # Nombre estable `ai-gateway`: es el hostname que usa Nginx en la SPA y el
  # que coincide con el servicio de Docker Compose. Así la misma configuración
  # de Nginx funciona en ambos entornos.
  name: ai-gateway
  labels:
    app.kubernetes.io/name: riki-ai-gateway
    app.kubernetes.io/component: ai-gateway
    app.kubernetes.io/part-of: riki
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: riki-ai-gateway
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
