apiVersion: v1
kind: Service
metadata:
  # Nombre estable `backend`: es el hostname que usa Nginx en la SPA y el
  # que coincide con el servicio de Docker Compose. Así la misma configuración
  # de Nginx funciona en ambos entornos.
  name: backend
  labels:
    app.kubernetes.io/name: tuki-ai-gateway
    app.kubernetes.io/component: ai-gateway
    app.kubernetes.io/part-of: tuki
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tuki-ai-gateway
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP

---
# Alias de compatibilidad: las réplicas del frontend que aún tengan la imagen
# anterior (que resolvía `ai-gateway`) siguen funcionando durante el rollout.
# Puede eliminarse cuando todas las réplicas usen la configuración nueva.
apiVersion: v1
kind: Service
metadata:
  name: ai-gateway
  labels:
    app.kubernetes.io/name: tuki-ai-gateway
    app.kubernetes.io/component: ai-gateway
    app.kubernetes.io/part-of: tuki
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tuki-ai-gateway
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
