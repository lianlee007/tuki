apiVersion: v1
kind: Service
metadata:
  # Nginx de la SPA resuelve `vision:8000` en /vision/. Mismo nombre que en
  # Docker Compose para no duplicar configuración.
  name: vision
  labels:
    app.kubernetes.io/name: tuki-vision
    app.kubernetes.io/component: vision
    app.kubernetes.io/part-of: tuki
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tuki-vision
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
