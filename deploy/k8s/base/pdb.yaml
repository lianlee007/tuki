apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: riki
  labels:
    app.kubernetes.io/name: riki
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: riki
spec:
  # Con 2 réplicas, permite drenar un nodo a la vez sin dejar el sitio caído.
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/name: riki
