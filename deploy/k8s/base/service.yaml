apiVersion: v1
kind: Service
metadata:
  name: tuki
  labels:
    app.kubernetes.io/name: tuki
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: tuki
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tuki
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9113
      targetPort: metrics
      protocol: TCP
