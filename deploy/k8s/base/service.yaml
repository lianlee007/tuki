apiVersion: v1
kind: Service
metadata:
  name: riki
  labels:
    app.kubernetes.io/name: riki
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: riki
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: riki
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9113
      targetPort: metrics
      protocol: TCP
