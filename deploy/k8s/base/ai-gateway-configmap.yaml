apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-gateway-config
  labels:
    app.kubernetes.io/name: riki-ai-gateway
    app.kubernetes.io/component: ai-gateway
    app.kubernetes.io/part-of: riki
data:
  AI_ENVIRONMENT: "production"
  AI_LOG_LEVEL: "INFO"
  # `supabase` valida el JWT del usuario. El tráfico anónimo del carrito sigue
  # permitido con cuota por IP; ponlo en `false` para exigir sesión siempre.
  AI_AUTH_MODE: "supabase"
  AI_ALLOW_ANON: "true"

  # El overlay de producción debe reemplazar este valor con la URL real.
  # Sin él, el gateway falla al arrancar (fail-fast) con un mensaje claro.
  SUPABASE_URL: ""

  AI_GROQ_MODELS: "openai/gpt-oss-120b,openai/gpt-oss-20b,allam-2-7b"
  AI_GROQ_TIMEOUT_SECONDS: "25"
  AI_GROQ_TOTAL_TIMEOUT_SECONDS: "40"

  AI_RATE_LIMIT_ANON_PER_MINUTE: "10"
  AI_RATE_LIMIT_ANON_BURST: "4"
  AI_RATE_LIMIT_AUTH_PER_MINUTE: "30"
  AI_RATE_LIMIT_AUTH_BURST: "8"

  AI_OTEL_ENABLED: "false"
