apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tuki
  labels:
    app.kubernetes.io/name: tuki
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: tuki
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "64k"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "5"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - tuki.example.com
      secretName: tuki-tls
  rules:
    - host: tuki.example.com
      http:
        paths:
          # El AI Gateway conserva el prefijo /api; Nginx e Ingress solo
          # enrutan, no reescriben la ruta.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tuki
                port:
                  name: http
