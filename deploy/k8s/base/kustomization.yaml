apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tuki

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - deployment.yaml
  - service.yaml
  - ai-gateway-configmap.yaml
  - ai-gateway-deployment.yaml
  - ai-gateway-service.yaml
  - vision-configmap.yaml
  - vision-deployment.yaml
  - vision-service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - ai-gateway-pdb.yaml
  - networkpolicy.yaml

# Cambia `ghcr.io/lianlee007/...` por tu registro y el tag por la versión
# publicada. También puedes sobreescribirlo desde un overlay.
images:
  - name: ghcr.io/lianlee007/tuki
    newTag: "0.1.0"
  - name: ghcr.io/lianlee007/tuki-ai-gateway
    newTag: "0.1.0"
  - name: ghcr.io/lianlee007/tuki-vision
    newTag: "0.1.0"
