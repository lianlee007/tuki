apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tuki-lectura
  labels:
    app.kubernetes.io/name: tuki
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: tuki
rules:
  # Un integrante del equipo necesita diagnosticar, no mutar: el estado deseado
  # vive en Git y lo aplica ArgoCD. Este rol permite `kubectl get/describe/logs`
  # sin abrir la puerta a cambios manuales ni a leer Secretos.
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "configmaps", "endpoints", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tuki-lectura
  labels:
    app.kubernetes.io/name: tuki
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: tuki
subjects:
  # Grupo de laboratorio. En producción se sustituye por el grupo del proveedor
  # de identidad institucional (OIDC) y se gestiona fuera del repositorio.
  - kind: Group
    name: tuki-desarrolladores
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tuki-lectura
