apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tuki-ai-gateway
  labels:
    app.kubernetes.io/name: tuki-ai-gateway
    app.kubernetes.io/component: ai-gateway
    app.kubernetes.io/part-of: tuki
spec:
  # Con una sola réplica, exigir minAvailable: 1 bloquearía cualquier drenaje
  # del nodo. Permitimos una interrupción voluntaria y dejamos que el
  # ReplicaSet lo recree.
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/name: tuki-ai-gateway
