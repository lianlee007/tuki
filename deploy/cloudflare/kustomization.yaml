apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Solo el túnel. El enrutamiento (qué host va a qué Service) vive en Cloudflare,
# no aquí, para que el clúster no dependa del proveedor de borde.
#
# Requisito previo:
#   kubectl -n tuki create secret generic cloudflared-token \
#     --from-literal=token="$(cloudflared tunnel token tuki)"
namespace: tuki

resources:
  - cloudflared-deployment.yaml
