apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: riki-local
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: riki
    environment: local
spec:
  project: default

  source:
    repoURL: https://github.com/Leonardo007x/LeeFood.git
    targetRevision: main
    path: deploy/k8s/overlays/local

  destination:
    server: https://kubernetes.default.svc
    namespace: riki

  # En local el sync es manual a propósito: las imágenes son `riki:local-*` y
  # el secreto de Groq se crea fuera de Git. Desde la UI/CLI:
  #   argocd app sync riki-local
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m

  revisionHistoryLimit: 5
