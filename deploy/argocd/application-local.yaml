apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tuki-local
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: tuki
    environment: local
spec:
  project: default

  source:
    repoURL: https://github.com/lianlee007/tuki.git
    targetRevision: main
    path: deploy/k8s/overlays/local

  destination:
    server: https://kubernetes.default.svc
    namespace: tuki

  # En local el sync es manual a propósito: las imágenes son `tuki:local-*` y
  # el secreto de Groq se crea fuera de Git. Desde la UI/CLI:
  #   argocd app sync tuki-local
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m

  revisionHistoryLimit: 5
