apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: riki-production
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: riki
    environment: production
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/Leonardo007x/LeeFood.git
    targetRevision: main
    path: deploy/k8s/overlays/production

  destination:
    server: https://kubernetes.default.svc
    namespace: riki

  # ArgoCD no debe pelear con el HPA por el campo replicas.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

  revisionHistoryLimit: 10
