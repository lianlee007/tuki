apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tuki-laboratorio
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: tuki
    environment: laboratorio
spec:
  project: default

  # El clúster de laboratorio no tiene credenciales del repositorio privado.
  # Se sirve el mismo historial de Git con `git daemon` desde el equipo:
  #   git daemon --base-path=<ruta-del-repo> --export-all --port=9418
  # En un entorno real se sustituye por la URL del repositorio institucional.
  source:
    repoURL: git://host.docker.internal:9418/Kiri
    targetRevision: main
    path: deploy/k8s/overlays/local-plataforma

  destination:
    server: https://kubernetes.default.svc
    namespace: tuki

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m

  # El HPA es dueño de `spec.replicas`. Sin esta excepción ArgoCD vería deriva
  # permanente cada vez que el autoscaler cambia el número de réplicas.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas

  revisionHistoryLimit: 5
