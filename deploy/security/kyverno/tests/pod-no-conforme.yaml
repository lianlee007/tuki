# Pod que debe ser rechazado: root, privilegiado y con rootfs escribible.
# Lo usa `deploy/scripts/validar-kyverno.sh` para probar que la política muerde.
apiVersion: v1
kind: Pod
metadata:
  name: pod-no-conforme
  namespace: tuki
spec:
  securityContext:
    runAsNonRoot: false
  containers:
    - name: web
      image: ghcr.io/lianlee007/tuki:0.1.0
      securityContext:
        allowPrivilegeEscalation: true
        readOnlyRootFilesystem: false
        privileged: true
        capabilities:
          add:
            - NET_ADMIN
