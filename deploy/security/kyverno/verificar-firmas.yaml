# =============================================================================
# Solo se admiten pods cuyas imágenes hayan sido firmadas con Cosign keyless
# por el workflow de CI del repositorio. Cierra el ciclo SLSA/Sigstore: una
# imagen construida fuera del pipeline autorizado no arranca, aunque alguien
# tenga permisos para crear el Deployment.
#
# API CEL de Kyverno (policies.kyverno.io/v1). Requiere Kyverno 1.19 o superior:
# la API heredada `kyverno.io/v1` dejó de aceptar escrituras en 1.20.
#   kubectl apply -k deploy/security/kyverno
# =============================================================================
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verificar-firmas-tuki
  annotations:
    policies.kyverno.io/title: Verificar firmas de las imágenes de Tuki
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Exige firma keyless de Sigstore con la identidad del workflow de CI y
      digest inmutable; una imagen no autorizada no supera la admisión.
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: [CREATE, UPDATE]
        resources: [pods]
  matchConditions:
    - name: solo-namespace-tuki
      expression: "object.metadata.?namespace.orValue('') == 'tuki'"
  matchImageReferences:
    - glob: "ghcr.io/lianlee007/tuki*"
  attestors:
    - name: ciTuki
      cosign:
        keyless:
          identities:
            - subject: "https://github.com/lianlee007/tuki/.github/workflows/contenedor.yml@refs/heads/main"
              issuer: "https://token.actions.githubusercontent.com"
        ctlog:
          url: "https://rekor.sigstore.dev"
  validationConfigurations:
    # Un tag puede moverse; el digest no. La firma se verifica sobre el digest.
    mutateDigest: true
    required: true
    verifyDigest: true
  validations:
    - message: "La imagen debe estar firmada por el workflow de CI de Tuki."
      expression: >-
        images.containers.map(image, verifyImageSignatures(image, [attestors.ciTuki])).all(e, e > 0)
