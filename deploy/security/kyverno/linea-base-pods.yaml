# =============================================================================
# Línea base de seguridad de pods para Tuki.
#
# Refuerza en admisión las mismas reglas que conftest valida en CI:
# sin privilegios, sin escalada, rootfs de solo lectura, capacidades retiradas
# y sin acceso al host. conftest protege el repositorio; esto protege el
# clúster aunque alguien aplique un manifiesto por fuera de Git.
#
# API CEL de Kyverno (policies.kyverno.io/v1). Requiere Kyverno 1.19 o superior:
# la API heredada `kyverno.io/v1` dejó de aceptar escrituras en 1.20.
#   kubectl apply -k deploy/security/kyverno
# =============================================================================
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: linea-base-pods-tuki
  annotations:
    policies.kyverno.io/title: Línea base de seguridad de pods
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Exige contexto sin privilegios, sin escalada, rootfs de solo lectura y
      todas las capacidades retiradas en el namespace tuki.
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: [CREATE, UPDATE]
        resources: [pods]
  matchConditions:
    - name: solo-namespace-tuki
      expression: "object.metadata.?namespace.orValue('') == 'tuki'"
  validations:
    - message: >-
        El pod debe ejecutarse sin privilegios, sin escalada, con rootfs de
        solo lectura y con todas las capacidades retiradas.
      expression: >-
        object.spec.?securityContext.?runAsNonRoot.orValue(false) == true &&
        object.spec.containers.all(c,
          c.securityContext.?allowPrivilegeEscalation.orValue(true) == false &&
          c.securityContext.?readOnlyRootFilesystem.orValue(false) == true &&
          c.securityContext.?privileged.orValue(false) == false &&
          c.securityContext.?capabilities.?drop.orValue([]).exists(d, d == 'ALL')
        ) &&
        object.spec.?initContainers.orValue([]).all(c,
          c.securityContext.?allowPrivilegeEscalation.orValue(true) == false &&
          c.securityContext.?readOnlyRootFilesystem.orValue(false) == true &&
          c.securityContext.?privileged.orValue(false) == false &&
          c.securityContext.?capabilities.?drop.orValue([]).exists(d, d == 'ALL')
        )
    - message: "No se permite hostNetwork, hostPID, hostIPC ni volúmenes hostPath en tuki."
      expression: >-
        object.spec.?hostNetwork.orValue(false) == false &&
        object.spec.?hostPID.orValue(false) == false &&
        object.spec.?hostIPC.orValue(false) == false &&
        object.spec.?volumes.orValue([]).all(v, !has(v.hostPath))
