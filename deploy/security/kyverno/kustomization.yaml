apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Políticas de admisión del clúster. Se aplican aparte del overlay de la
# aplicación porque son objetos de alcance global (ValidatingPolicy e
# ImageValidatingPolicy).
#
#   kubectl apply -k deploy/security/kyverno
#
# Requiere Kyverno 1.19 o superior. La API heredada `kyverno.io/v1`
# (ClusterPolicy) dejó de aceptar escrituras en Kyverno 1.20; estas políticas
# usan la API CEL `policies.kyverno.io/v1`.
#
# Instalación (sin Helm):
#   kubectl create namespace kyverno
#   kubectl apply -f https://github.com/kyverno/kyverno/releases/latest/download/install.yaml
#
# Validación sin clúster:
#   bash deploy/scripts/validar-kyverno.sh
resources:
  - verificar-firmas.yaml
  - linea-base-pods.yaml
