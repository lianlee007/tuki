apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Políticas de admisión del clúster. Se aplican aparte del overlay de la
# aplicación porque son objetos de alcance global (ClusterPolicy).
#
#   kubectl apply -k deploy/security/kyverno
#
# Requiere Kyverno instalado:
#   helm repo add kyverno https://kyverno.github.io/kyverno
#   helm install kyverno kyverno/kyverno -n kyverno --create-namespace
resources:
  - verificar-firmas.yaml
  - linea-base-pods.yaml
