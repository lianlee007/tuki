name: tuki

# Uso:
#   docker compose --env-file .env.local up -d --build
#   docker compose --env-file .env.local ps
#   docker compose --env-file .env.local logs -f frontend backend
#   docker compose --env-file .env.local down
#
# Dos contenedores:
#   frontend -> SPA de Vite servida por Nginx.
#   backend  -> AI Gateway en FastAPI (auth, cuotas, Groq y métricas).
#
# Nota: las variables VITE_* se incrustan en el bundle durante el build, por
# eso aparecen en `build.args` y no en `environment`. La clave de Groq es un
# secreto de servidor y solo se pasa al contenedor `backend` en runtime.

services:
  # Frontend: compila la SPA y la sirve con Nginx en el puerto 8080.
  # `container_name` fija el nombre visible en Docker Desktop > Containers.
  frontend:
    container_name: tuki-frontend
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?Define VITE_SUPABASE_URL en el archivo de entorno}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:?Define VITE_SUPABASE_ANON_KEY en el archivo de entorno}
        VITE_AI_GATEWAY_URL: ${VITE_AI_GATEWAY_URL:-/api}
        VITE_VISION_URL: ${VITE_VISION_URL:-/vision}
        VERSION: ${TUKI_VERSION:-local}
        REVISION: ${TUKI_REVISION:-local}

    image: ${TUKI_IMAGE:-tuki}:${TUKI_VERSION:-local}

    ports:
      - "${TUKI_PORT:-8080}:8080"

    depends_on:
      backend:
        condition: service_healthy
      vision:
        condition: service_started

    # El proceso corre sin privilegios y no necesita escribir en el rootfs.
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M

    restart: unless-stopped
    stop_grace_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Backend: AI Gateway de FastAPI. Nginx lo alcanza como `backend:8000`.
  backend:
    container_name: tuki-backend
    build:
      context: ./services/ai-gateway
      dockerfile: Dockerfile
      args:
        VERSION: ${TUKI_VERSION:-local}
        REVISION: ${TUKI_REVISION:-local}
        WITH_OTEL: ${AI_WITH_OTEL:-false}

    image: ${AI_GATEWAY_IMAGE:-tuki-ai-gateway}:${TUKI_VERSION:-local}

    # Solo para probar el gateway directamente; Nginx lo consume por la red
    # interna. En producción este puerto no se publica.
    ports:
      - "127.0.0.1:${AI_GATEWAY_PORT:-8001}:8000"

    environment:
      AI_ENVIRONMENT: ${AI_ENVIRONMENT:-development}
      # En local se desactiva la validación JWT; en producción usa `supabase`.
      AI_AUTH_MODE: ${AI_AUTH_MODE:-disabled}
      AI_ALLOW_ANON: ${AI_ALLOW_ANON:-true}
      AI_LOG_LEVEL: ${AI_LOG_LEVEL:-INFO}
      GROQ_API_KEY: ${GROQ_API_KEY:?Define GROQ_API_KEY en el archivo de entorno}
      SUPABASE_URL: ${VITE_SUPABASE_URL:-}
      # Clave pública: solo se usa para validar los JWT HS256 contra GoTrue.
      SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
      AI_GROQ_MODELS: ${AI_GROQ_MODELS:-openai/gpt-oss-120b,openai/gpt-oss-20b,allam-2-7b}
      AI_GROQ_TIMEOUT_SECONDS: ${AI_GROQ_TIMEOUT_SECONDS:-25}
      AI_GROQ_TOTAL_TIMEOUT_SECONDS: ${AI_GROQ_TOTAL_TIMEOUT_SECONDS:-40}
      AI_RATE_LIMIT_ANON_PER_MINUTE: ${AI_RATE_LIMIT_ANON_PER_MINUTE:-10}
      AI_RATE_LIMIT_ANON_BURST: ${AI_RATE_LIMIT_ANON_BURST:-4}
      AI_RATE_LIMIT_AUTH_PER_MINUTE: ${AI_RATE_LIMIT_AUTH_PER_MINUTE:-30}
      AI_RATE_LIMIT_AUTH_BURST: ${AI_RATE_LIMIT_AUTH_BURST:-8}
      # Solo tienen efecto si la imagen se construyó con AI_WITH_OTEL=true.
      AI_OTEL_ENABLED: ${AI_OTEL_ENABLED:-false}
      AI_OTEL_ENDPOINT: ${AI_OTEL_ENDPOINT:-}

    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3).status == 200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 192M
        reservations:
          cpus: "0.05"
          memory: 64M

    restart: unless-stopped
    stop_grace_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Visión: clasificador local (Ultralytics) que revisa las fotos de platos.
  # No llama a Internet: los pesos viajan en la imagen.
  vision:
    container_name: tuki-vision
    build:
      context: ./services/vision-service
      dockerfile: Dockerfile
      args:
        VERSION: ${TUKI_VERSION:-local}
        REVISION: ${TUKI_REVISION:-local}

    image: ${VISION_IMAGE:-tuki-vision}:${TUKI_VERSION:-local}

    # Solo para probar el servicio directamente; Nginx lo consume por la red
    # interna. En producción este puerto no se publica.
    ports:
      - "127.0.0.1:${VISION_PORT:-8002}:8000"

    environment:
      VISION_ENVIRONMENT: ${VISION_ENVIRONMENT:-development}
      VISION_LOG_LEVEL: ${VISION_LOG_LEVEL:-INFO}
      VISION_MODEL_PATH: /app/modelos/comida-v1.pt
      VISION_UMBRAL_COMIDA: ${VISION_UMBRAL_COMIDA:-0.3}
      VISION_ETIQUETA_COMIDA: ${VISION_ETIQUETA_COMIDA:-comida}
      VISION_IMGSZ: ${VISION_IMGSZ:-224}
      VISION_DEVICE: ${VISION_DEVICE:-cpu}
      VISION_MAX_IMAGEN_BYTES: ${VISION_MAX_IMAGEN_BYTES:-8388608}
      YOLO_OFFLINE: "true"
      YOLO_AUTOINSTALL: "false"

    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3).status == 200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      # torch y los pesos tardan en cargar en el primer arranque.
      start_period: 60s

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.10"
          memory: 384M

    restart: unless-stopped
    stop_grace_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
