# API público de TukiTuki.
# Enruta por prefijo a cada microservicio y expone los objetos de RustFS en
# /tuki-media para que el media-service pueda devolver URLs públicas.

server {
  listen 80;
  server_name _;
  client_max_body_size 12m;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 60s;
  proxy_send_timeout 60s;

  location = /salud {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location /v1/identidad {
    proxy_pass http://identidad-service:3001;
  }

  location /v1/restaurantes {
    proxy_pass http://restaurantes-service:3002;
  }

  location /v1/media {
    proxy_pass http://media-service:3003;
  }

  location /v1/pedidos {
    proxy_pass http://pedidos-service:3004;
  }

  location /v1/resenas {
    proxy_pass http://resenas-service:3005;
  }

  location /v1/admin {
    proxy_pass http://admin-service:3006;
  }

  location /api/v1/ai {
    proxy_pass http://ai-gateway:8000;
  }

  # RustFS sirve los objetos con path-style: /tuki-media/<clave>.
  location /tuki-media/ {
    proxy_pass http://rustfs:9000;
    proxy_buffering off;
  }

  location / {
    add_header Content-Type application/json;
    return 404 '{"error":{"codigo":"no_encontrado","mensaje":"Ruta no disponible"}}';
  }
}
