server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # `index.html` nombra el JS y el CSS de cada compilación con su hash. Si el
  # navegador lo guarda, la siguiente visita arranca con el HTML viejo y pide
  # los assets viejos: el panel se ve desactualizado hasta una recarga forzada.
  # No se guarda nunca; cada entrada revalida contra el servidor.
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate" always;
  }

  # Igual que el HTML: es configuración de tiempo de ejecución y cambia en cada
  # despliegue (URLs del panel, del sitio público, etc.).
  location = /config.js {
    add_header Cache-Control "no-store, must-revalidate" always;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache" always;
  }

  # Los assets de Vite llevan el hash del contenido en el nombre, así que se
  # pueden cachear para siempre. Si falta uno —una pestaña abierta con el HTML
  # de una versión anterior— se responde 404 en vez de devolver el index.html
  # como si fuera JavaScript.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Fallback de SPA: las rutas de React Router no existen como archivos.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /salud {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }
}
