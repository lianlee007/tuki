server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Fallback de SPA: las rutas de React Router no existen como archivos.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /salud {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }
}
