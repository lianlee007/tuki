name: tukituki

# Orígenes permitidos por los servicios durante el desarrollo local.
# Incluye los puertos de Vite y los de los contenedores Nginx.
x-cors-origenes: &cors-origenes "http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:8081,http://localhost:8082,http://localhost:8083,https://tukituki.example.com,https://panel.tukituki.example.com,https://admin.tukituki.example.com"

# Configuración común de los tres frontends: nginx sirve la SPA y, antes de
# arrancar, escribe /config.js con las URLs públicas del stack local.
x-frontend: &frontend
  environment:
    TUKI_API_URL: http://localhost:8084
    TUKI_ADMIN_PANEL_URL: http://localhost:8083
    TUKI_PANEL_URL: http://localhost:8082
    TUKI_WEB_URL: http://localhost:8081
  entrypoint:
    - /bin/sh
    - -c
    - /tuki/generar-config.sh && exec /docker-entrypoint.sh nginx -g 'daemon off;'
  volumes:
    - ./gateway/generar-config.sh:/tuki/generar-config.sh:ro
  depends_on:
    api-gateway:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/salud || exit 1"]
    interval: 30s
    timeout: 5s
    retries: 5
    start_period: 10s

# Los servicios Node exponen /listo cuando terminaron de migrar y escuchar.
x-healthcheck-node: &healthcheck-node
  test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:' + process.env.PUERTO + '/listo').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
  interval: 30s
  timeout: 5s
  retries: 5
  start_period: 40s

# Stack local completo de TukiTuki.
# Levanta PostgreSQL, Redis, RustFS, Mailpit, Traefik, los seis servicios Node,
# el gateway de IA, el revisor de imágenes, un API Gateway con Nginx y los tres
# frontends. El API Gateway publica una sola URL (http://localhost:8084) por la
# que los frontends consumen todos los servicios y las imágenes.
# Uso: docker compose -f infra/docker/docker-compose.yml up -d --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: tukituki-postgresdb
    environment:
      POSTGRES_USER: tuki_admin
      POSTGRES_PASSWORD: tuki_admin_dev
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tuki_admin -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tukituki-rediscache
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # MinIO dejó de publicar sus imágenes en octubre de 2025. RustFS es un
  # servidor S3 compatible, Apache 2.0, que ocupa el mismo puerto y la misma
  # API; el código del media-service no cambia.
  rustfs:
    image: rustfs/rustfs:1.0.4
    container_name: tukituki-rustfsstorage
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: tuki_s3
      RUSTFS_SECRET_KEY: tuki_s3_dev
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      # El panel dibuja la tarjeta del QR en un lienzo y recorta el logo dentro.
      # Un `<img>` normal no necesita CORS, pero leer los píxeles de otro origen
      # para convertirlos en PNG sí: sin esto el logo no se puede incrustar.
      RUSTFS_CORS_ALLOWED_ORIGINS: *cors-origenes
      RUSTFS_OBS_LOGGER_LEVEL: error
      RUSTFS_OBS_LOG_DIRECTORY: /var/log/rustfs/
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/var/log/rustfs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: tukituki-mailpitsmtp
    ports:
      - "8025:8025"
      - "1025:1025"

  traefik:
    image: traefik:v3.8
    container_name: tukituki-traefikproxy
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      # 80/8080 suelen estar ocupados por el stack legacy o por WSL.
      - "8088:80"
      - "8089:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  identidad-service:
    build:
      context: ../..
      dockerfile: services/identidad-service/Dockerfile
    container_name: tukituki-identidadbe
    environment:
      NODE_ENV: development
      PUERTO: "3001"
      DATABASE_URL: postgres://tuki_identidad:tuki_identidad_dev@postgres:5432/tuki_identidad
      JWT_SECRETO: ${JWT_SECRETO:-cambio-este-secreto-en-produccion}
      JWT_EMISOR: tuki-identidad
      JWT_AUDIENCIA: tuki
      CORS_ORIGENES: *cors-origenes
    command: ["sh", "-c", "node dist/db/migrar.js && node --import ./dist/telemetria.js dist/servidor.js"]
    healthcheck: *healthcheck-node
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.identidad.rule=Host(`identidad.tukituki.local`)"
      - "traefik.http.services.identidad.loadbalancer.server.port=3001"
    restart: unless-stopped

  restaurantes-service:
    build:
      context: ../..
      dockerfile: services/restaurantes-service/Dockerfile
    container_name: tukituki-restaurantesbe
    environment:
      NODE_ENV: development
      PUERTO: "3002"
      DATABASE_URL: postgres://tuki_restaurantes:tuki_restaurantes_dev@postgres:5432/tuki_restaurantes
      JWT_SECRETO: ${JWT_SECRETO:-cambio-este-secreto-en-produccion}
      JWT_EMISOR: tuki-identidad
      JWT_AUDIENCIA: tuki
      CORS_ORIGENES: *cors-origenes
      # El navegador carga las imágenes desde el API Gateway, no desde el
      # puerto interno de RustFS.
      MEDIA_PUBLIC_URL: http://localhost:8084/tuki-media
    command: ["sh", "-c", "node dist/db/migrar.js && node --import ./dist/telemetria.js dist/servidor.js"]
    healthcheck: *healthcheck-node
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.restaurantes.rule=Host(`restaurantes.tukituki.local`)"
      - "traefik.http.services.restaurantes.loadbalancer.server.port=3002"
    restart: unless-stopped

  media-service:
    build:
      context: ../..
      dockerfile: services/media-service/Dockerfile
    container_name: tukituki-mediabe
    environment:
      NODE_ENV: development
      PUERTO: "3003"
      DATABASE_URL: postgres://tuki_media:tuki_media_dev@postgres:5432/tuki_media
      JWT_SECRETO: ${JWT_SECRETO:-cambio-este-secreto-en-produccion}
      JWT_EMISOR: tuki-identidad
      JWT_AUDIENCIA: tuki
      CORS_ORIGENES: *cors-origenes
      S3_ENDPOINT: http://rustfs:9000
      S3_REGION: us-east-1
      S3_BUCKET: tuki-media
      S3_ACCESS_KEY: tuki_s3
      S3_SECRET_KEY: tuki_s3_dev
      S3_PUBLIC_URL: http://localhost:8084/tuki-media
      # Revisor de fotos: el servicio de visión decide si la imagen es comida.
      VISION_URL: http://vision:8000
    command: ["sh", "-c", "node dist/db/migrar.js && node --import ./dist/telemetria.js dist/servidor.js"]
    healthcheck: *healthcheck-node
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started
      vision:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.media.rule=Host(`media.tukituki.local`)"
      - "traefik.http.services.media.loadbalancer.server.port=3003"
    restart: unless-stopped

  # Visión: clasificador local (Ultralytics YOLO11n-cls) que revisa las fotos
  # de platos antes de guardarlas. No llama a Internet: los pesos van en la
  # imagen. `media-service` lo consulta por VISION_URL.
  vision:
    build:
      context: ../../services/vision-service
      dockerfile: Dockerfile
    container_name: tukituki-visionbe
    environment:
      VISION_ENVIRONMENT: development
      VISION_MODEL_PATH: /app/modelos/comida-v1.pt
      VISION_UMBRAL_COMIDA: ${VISION_UMBRAL_COMIDA:-0.65}
      VISION_DEVICE: cpu
      YOLO_OFFLINE: "true"
    ports:
      - "8002:8000"
    restart: unless-stopped

  pedidos-service:
    build:
      context: ../..
      dockerfile: services/pedidos-service/Dockerfile
    container_name: tukituki-pedidosbe
    environment:
      NODE_ENV: development
      PUERTO: "3004"
      DATABASE_URL: postgres://tuki_pedidos:tuki_pedidos_dev@postgres:5432/tuki_pedidos
      JWT_SECRETO: ${JWT_SECRETO:-cambio-este-secreto-en-produccion}
      JWT_EMISOR: tuki-identidad
      JWT_AUDIENCIA: tuki
      RESTAURANTES_URL: http://restaurantes-service:3002
      CORS_ORIGENES: *cors-origenes
    command: ["sh", "-c", "node dist/db/migrar.js && node --import ./dist/telemetria.js dist/servidor.js"]
    healthcheck: *healthcheck-node
    ports:
      - "3004:3004"
    depends_on:
      postgres:
        condition: service_healthy
      restaurantes-service:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pedidos.rule=Host(`pedidos.tukituki.local`)"
      - "traefik.http.services.pedidos.loadbalancer.server.port=3004"
    restart: unless-stopped

  resenas-service:
    build:
      context: ../..
      dockerfile: services/resenas-service/Dockerfile
    container_name: tukituki-resenasbe
    environment:
      NODE_ENV: development
      PUERTO: "3005"
      DATABASE_URL: postgres://tuki_resenas:tuki_resenas_dev@postgres:5432/tuki_resenas
      JWT_SECRETO: ${JWT_SECRETO:-cambio-este-secreto-en-produccion}
      JWT_EMISOR: tuki-identidad
      JWT_AUDIENCIA: tuki
      RESTAURANTES_URL: http://restaurantes-service:3002
      CORS_ORIGENES: *cors-origenes
    command: ["sh", "-c", "node dist/db/migrar.js && node --import ./dist/telemetria.js dist/servidor.js"]
    healthcheck: *healthcheck-node
    ports:
      - "3005:3005"
    depends_on:
      postgres:
        condition: service_healthy
      restaurantes-service:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.resenas.rule=Host(`resenas.tukituki.local`)"
      - "traefik.http.services.resenas.loadbalancer.server.port=3005"
    restart: unless-stopped

  admin-service:
    build:
      context: ../..
      dockerfile: services/admin-service/Dockerfile
    container_name: tukituki-adminbe
    environment:
      NODE_ENV: development
      PUERTO: "3006"
      DATABASE_URL: postgres://tuki_admin:tuki_admin_dev@postgres:5432/tuki_admin
      JWT_SECRETO: ${JWT_SECRETO:-cambio-este-secreto-en-produccion}
      JWT_EMISOR: tuki-identidad
      JWT_AUDIENCIA: tuki
      IDENTIDAD_URL: http://identidad-service:3001
      RESTAURANTES_URL: http://restaurantes-service:3002
      PEDIDOS_URL: http://pedidos-service:3004
      CORS_ORIGENES: *cors-origenes
    command: ["sh", "-c", "node dist/db/migrar.js && node --import ./dist/telemetria.js dist/servidor.js"]
    healthcheck: *healthcheck-node
    ports:
      - "3006:3006"
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin-service.rule=Host(`admin-api.tukituki.local`)"
      - "traefik.http.services.admin-service.loadbalancer.server.port=3006"
    restart: unless-stopped

  # Ollama en contenedor: el gateway le habla por la red interna
  # (http://ollama:11434), sin depender del Ollama del host. No se publica el
  # 11434 para no chocar con una instalación nativa en la maquina.
  ollama:
    image: ollama/ollama:0.12.6
    container_name: tukituki-ollamabe
    environment:
      # El modelo se queda cargado para que la demo no pague la carga inicial
      # (con poca RAM libre, recargarlo cuesta más de un minuto).
      OLLAMA_KEEP_ALIVE: 2h
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  # Job de una sola vez: deja los modelos dentro del volumen de Ollama.
  # Es idempotente; si ya estan, no vuelve a descargar.
  ollama-init:
    image: ollama/ollama:0.12.6
    container_name: tukituki-ollama-init
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ../../services/ai-gateway/Modelfile:/tuki/Modelfile:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        # Si no hay internet pero los modelos ya están en el volumen, el job
        # termina bien en lugar de quedar en rojo.
        ollama pull qwen2.5:1.5b-instruct || echo "AVISO: sin internet; uso los modelos locales"
        ollama pull nomic-embed-text || echo "AVISO: sin internet; uso los modelos locales"
        ollama create tuki-chef -f /tuki/Modelfile
        ollama list
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # Ajusta el dueno del volumen del indice: el gateway corre como 10001 y un
  # volumen nuevo nace como root, asi que no podria escribir la cache.
  ai-gateway-permisos:
    image: alpine:3.20
    container_name: tukituki-ai-gateway-permisos
    command: ["sh", "-c", "mkdir -p /datos && chown -R 10001:10001 /datos"]
    volumes:
      - ai_gateway_data:/datos
    restart: "no"

  ai-gateway:
    build:
      context: ../../services/ai-gateway
      dockerfile: Dockerfile
    container_name: tukituki-ai-gatewaybe
    environment:
      AI_ENVIRONMENT: development
      AI_AUTH_MODE: local
      AI_ALLOW_ANON: "true"
      AI_LOG_LEVEL: INFO
      AI_OLLAMA_URL: ${AI_OLLAMA_URL:-http://ollama:11434}
      AI_OLLAMA_MODELO_CHAT: ${AI_OLLAMA_MODELO_CHAT:-tuki-chef}
      AI_OLLAMA_MODELO_EMBEDDINGS: ${AI_OLLAMA_MODELO_EMBEDDINGS:-nomic-embed-text}
      # Mantiene tuki-chef en memoria para que la primera respuesta sea rápida.
      AI_OLLAMA_KEEP_ALIVE: ${AI_OLLAMA_KEEP_ALIVE:-2h}
      AI_RESTAURANTES_URL: http://restaurantes-service:3002
      AI_RESENAS_URL: http://resenas-service:3005
      # El índice se reconstruye cada 5 min por defecto y eso hace que la
      # primera pregunta tras una pausa tarde 20-40 s. En local se deja una
      # hora; para forzar datos nuevos está POST /api/v1/ai/conocimiento/recargar.
      AI_CONOCIMIENTO_TTL_SECONDS: ${AI_CONOCIMIENTO_TTL_SECONDS:-3600}
      JWT_SECRETO: ${JWT_SECRETO:-cambio-este-secreto-en-produccion}
      JWT_EMISOR: tuki-identidad
      JWT_AUDIENCIA: tuki
      AI_CORS_ORIGINS: *cors-origenes
    volumes:
      # El indice RAG se guarda en /app/.datos; con el volumen sobrevive al
      # reinicio y el primer request no paga la reconstruccion completa.
      - ai_gateway_data:/app/.datos
    depends_on:
      ollama:
        condition: service_healthy
      ai-gateway-permisos:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ai-gateway.rule=Host(`ai.tukituki.local`)"
      - "traefik.http.services.ai-gateway.loadbalancer.server.port=8000"
    restart: unless-stopped

  # API Gateway local: una sola URL para los seis servicios, el gateway de IA
  # y los objetos de RustFS. Los frontends reciben esta URL en /config.js.
  api-gateway:
    image: nginx:1.27-alpine
    container_name: tukituki-apigw
    ports:
      - "8084:80"
    volumes:
      - ./gateway/api-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      identidad-service:
        condition: service_started
      restaurantes-service:
        condition: service_started
      media-service:
        condition: service_started
      pedidos-service:
        condition: service_started
      resenas-service:
        condition: service_started
      admin-service:
        condition: service_started
      ai-gateway:
        condition: service_started
      rustfs:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api-gateway.rule=Host(`api.tukituki.local`)"
      - "traefik.http.services.api-gateway.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/salud || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web-comensal:
    <<: *frontend
    image: tukituki-web-comensal
    build:
      context: ../..
      dockerfile: apps/web-comensal/Dockerfile
    container_name: tukituki-web-comensalfe
    ports:
      - "8081:80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web-comensal.rule=Host(`tukituki.local`)"
      - "traefik.http.services.web-comensal.loadbalancer.server.port=80"
    restart: unless-stopped

  panel-restaurante:
    <<: *frontend
    image: tukituki-web-panel
    build:
      context: ../..
      dockerfile: apps/panel-restaurante/Dockerfile
    container_name: tukituki-web-panelfe
    ports:
      - "8082:80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.panel-restaurante.rule=Host(`panel.tukituki.local`)"
      - "traefik.http.services.panel-restaurante.loadbalancer.server.port=80"
    restart: unless-stopped

  admin-plataforma:
    <<: *frontend
    image: tukituki-web-admin
    build:
      context: ../..
      dockerfile: apps/admin-plataforma/Dockerfile
    container_name: tukituki-web-adminfe
    ports:
      - "8083:80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin-plataforma.rule=Host(`admin.tukituki.local`)"
      - "traefik.http.services.admin-plataforma.loadbalancer.server.port=80"
    restart: unless-stopped

  # Importa los datos rescatados del Tuki original. Es opcional: no arranca con
  # `pnpm infra:up`. Para ejecutarlo:
  #   docker compose -f infra/docker/docker-compose.yml --profile importar \
  #     run --rm importador
  importador:
    profiles: ["importar"]
    image: postgres:16-alpine
    container_name: tukituki-importadorjob
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: tuki_admin
      PGPASSWORD: tuki_admin_dev
      PGDATABASE: postgres
    volumes:
      - ../../db/importacion/importar-produccion.sql:/importar.sql:ro
    command:
      - psql
      - -v
      - ON_ERROR_STOP=1
      - -v
      - tuki_media_url=http://localhost:8084/tuki-media
      - -f
      - /importar.sql
    depends_on:
      identidad-service:
        condition: service_healthy
      restaurantes-service:
        condition: service_healthy
      resenas-service:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  rustfs_data:
  rustfs_logs:
  ollama_data:
  ai_gateway_data:
