# API público local de TukiTuki.
# Enruta por prefijo a cada microservicio y expone los objetos de RustFS en
# /tuki-media para que el media-service pueda devolver URLs públicas.
#
# Los upstreams se resuelven en tiempo de petición con el DNS interno de Docker
# (127.0.0.11). Antes nginx resolvía el nombre una sola vez al arrancar: cuando
# un despliegue recreaba un servicio con otra IP, el gateway seguía apuntando a
# la vieja y devolvía 502 hasta reiniciarlo a mano.

server {
  listen 80;
  server_name _;
  client_max_body_size 12m;

  resolver 127.0.0.11 valid=10s ipv6=off;

  set $upstream_identidad http://identidad-service:3001;
  set $upstream_restaurantes http://restaurantes-service:3002;
  set $upstream_media http://media-service:3003;
  set $upstream_pedidos http://pedidos-service:3004;
  set $upstream_resenas http://resenas-service:3005;
  set $upstream_admin http://admin-service:3006;
  set $upstream_ai http://ai-gateway:8000;
  set $upstream_rustfs http://rustfs:9000;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 60s;
  proxy_send_timeout 60s;

  location = /salud {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location /v1/identidad {
    proxy_pass $upstream_identidad;
  }

  location /v1/restaurantes {
    proxy_pass $upstream_restaurantes;
  }

  location /v1/media {
    proxy_pass $upstream_media;
  }

  location /v1/pedidos {
    proxy_pass $upstream_pedidos;
  }

  location /v1/resenas {
    proxy_pass $upstream_resenas;
  }

  location /v1/admin {
    proxy_pass $upstream_admin;
  }

  location /api/v1/ai {
    proxy_pass $upstream_ai;
    # El RAG puede tardar: la primera consulta reconstruye el indice y el
    # modelo local corre en CPU. 60 s (el default) se queda corto.
    proxy_connect_timeout 10s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;
  }

  # RustFS sirve los objetos con path-style: /tuki-media/<clave>.
  location /tuki-media/ {
    proxy_pass $upstream_rustfs;
    proxy_buffering off;
  }

  location / {
    add_header Content-Type application/json;
    return 404 '{"error":{"codigo":"no_encontrado","mensaje":"Ruta no disponible"}}';
  }
}
