apiVersion: 1

# Limpia el datasource de Loki que dejaron versiones anteriores del stack.
deleteDatasources:
  - name: Loki
    orgId: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 30s
