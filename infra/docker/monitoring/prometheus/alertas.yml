# Registro de SLI y alertas del stack local de TukiTuki.
#
# Es el equivalente a infra/observability/prometheusrule-servicios.yaml, pero
# sin kube-state-metrics: los targets se identifican con la etiqueta `job` en
# lugar de `namespace`/`pod`.

groups:
  - name: tukituki.registro
    interval: 30s
    rules:
      - record: tuki:http_requests:rate5m
        expr: sum by (app) (rate(tuki_http_requests_total[5m]))

      - record: tuki:http_errors:ratio5m
        expr: |
          (
            sum by (app) (rate(tuki_http_requests_total{status=~"5.."}[5m]))
            or
            sum by (app) (rate(tuki_http_requests_total[5m])) * 0
          )
          /
          clamp_min(sum by (app) (rate(tuki_http_requests_total[5m])), 0.001)

      - record: tuki:http_latency:p95_5m
        expr: |
          histogram_quantile(
            0.95,
            sum by (app, le) (rate(tuki_http_request_duration_seconds_bucket[5m]))
          )

      - record: tuki:slo:availability_1h
        expr: |
          1 - (
            (
              sum(rate(tuki_http_requests_total{status=~"5.."}[1h]))
              or
              vector(0)
            )
            /
            clamp_min(sum(rate(tuki_http_requests_total[1h])), 0.001)
          )

  - name: tukituki.slo
    rules:
      - alert: TukiServicioCaido
        expr: up{job=~"tukituki-servicios|ai-gateway"} == 0
        for: 5m
        labels:
          severity: critical
          team: tukituki
        annotations:
          summary: "Prometheus no puede raspar un servicio de Tuki"
          description: "El target {{ $labels.instance }} no responde en /metrics."

      - alert: TukiDisponibilidadBaja
        expr: tuki:slo:availability_1h < 0.995
        for: 10m
        labels:
          severity: critical
          team: tukituki
        annotations:
          summary: "Disponibilidad por debajo del SLO (99.5 % en 1 h)"
          description: "Se está consumiendo el error budget más rápido de lo aceptado."

      - alert: TukiErrorRateAlta
        expr: tuki:http_errors:ratio5m > 0.05
        for: 10m
        labels:
          severity: warning
          team: tukituki
        annotations:
          summary: "Más del 5 % de peticiones fallan en {{ $labels.app }}"
          description: "Revisa logs, base de datos y dependencias del servicio."

      - alert: TukiLatenciaP95Alta
        expr: tuki:http_latency:p95_5m > 0.5
        for: 10m
        labels:
          severity: warning
          team: tukituki
        annotations:
          summary: "Latencia p95 por encima de 500 ms en {{ $labels.app }}"
          description: "Revisa CPU, pool de PostgreSQL y llamadas entre servicios."

      - alert: TukiDiscoBajo
        expr: |
          (
            node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}
            /
            node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}
          ) < 0.10
        for: 15m
        labels:
          severity: warning
          team: tukituki
        annotations:
          summary: "Queda menos del 10 % de disco en el host"
          description: "Prometheus y las imágenes de Docker comparten el disco del host."

      - alert: ObservabilidadGrafanaCaida
        expr: up{job="grafana"} == 0
        for: 3m
        labels:
          severity: critical
          team: tukituki
        annotations:
          summary: "Grafana no responde"
          description: "Abre http://localhost:3000: Grafana está caído o reiniciándose."

      - alert: ObservabilidadGrafanaMemoriaAlta
        expr: process_resident_memory_bytes{job="grafana"} > 640 * 1024 * 1024
        for: 10m
        labels:
          severity: warning
          team: tukituki
        annotations:
          summary: "Grafana usa más de 640 MB"
          description: "El límite del contenedor es 768 MB; cerca del tope vuelve el riesgo de OOM."
