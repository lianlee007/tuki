name: tukituki-monitoring

# Observabilidad local de TukiTuki.
#
# Se levanta junto al stack principal (`pnpm infra:up`) y comparte su red
# (`tukituki_default`). Así Prometheus raspa /metrics por DNS interno, sin
# depender de IPs ni de puertos publicados.
#
# Grafana y Prometheus quedan accesibles en:
#   http://localhost:3000   Grafana (admin / GRAFANA_ADMIN_PASSWORD)
#   http://localhost:9090   Prometheus
#
# Variables:
#   GRAFANA_ADMIN_PASSWORD    contraseña de admin (por defecto admin)
#   GRAFANA_ROOT_URL          URL pública de Grafana (por defecto localhost:3000)
#   TUKI_DOCKER_NETWORK       red del stack principal (por defecto tukituki_default)
#   PROMETHEUS_RETENTION      retención temporal (por defecto 7d)
#   PROMETHEUS_RETENTION_SIZE retención por tamaño (por defecto 1GB)

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: tukituki-mon-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-1GB}
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alertas.yml:/etc/prometheus/alertas.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Límites para que la observabilidad no compita con el resto del stack.
    mem_limit: 384m
    logging: *logging

  grafana:
    image: grafana/grafana:13.2.4
    container_name: tukituki-mon-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      # Al iniciar sesión se abre el dashboard de la aplicación.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/tukituki-aplicacion.json
      # Grafana 13 consume ~330 MB en reposo: se apaga el trabajo en segundo
      # plano que no se usa y se deja margen de memoria.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_ANALYTICS_CHECK_FOR_PLUGINS_UPDATES: "false"
      GF_NEWS_NEWSFEED_ENABLED: "false"
      # WAL reduce los bloqueos de SQLite cuando hay varias consultas a la vez.
      GF_DATABASE_WAL: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    # 768 MB: el proceso usa ~330 MB en reposo y necesita margen al abrir
    # dashboards. Con menos memoria el OOM killer lo reinicia.
    mem_limit: 768m
    logging: *logging

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: tukituki-mon-node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      # Sin `rslave`: algunos hosts (WSL, Docker en contenedores) tienen el
      # rootfs como montaje privado y Docker rechaza el contenedor.
      - /:/host:ro
    command:
      - --path.rootfs=/host
    ports:
      - "9100:9100"
    mem_limit: 64m
    logging: *logging

networks:
  default:
    external: true
    name: ${TUKI_DOCKER_NETWORK:-tukituki_default}

volumes:
  prometheus_data:
  grafana_data:
