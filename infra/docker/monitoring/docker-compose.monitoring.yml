name: tukituki-monitoring

# Observabilidad de TukiTuki sobre el host Docker de Dokploy.
#
# Se despliega como una aplicación Compose independiente que comparte la red
# del stack de producción (`tuki-tuki-mcftoo_default`). Así Prometheus raspa
# /metrics por DNS interno y Grafana queda detrás de Traefik, sin publicar
# ningún puerto de métricas.
#
# El host también ejecuta Dokploy y otros proyectos, así que esta pila es
# deliberadamente mínima: métricas de aplicación + métricas del host. cAdvisor
# y Loki se descartaron porque el host de 8 GB se quedó sin memoria y el panel
# de Dokploy dejó de responder.
#
# Variables:
#   GRAFANA_ADMIN_PASSWORD    obligatoria
#   GRAFANA_ROOT_URL          URL pública de Grafana (para enlaces y OAuth)
#   TUKI_DOCKER_NETWORK       red del stack de producción
#   PROMETHEUS_RETENTION      retención temporal (por defecto 7d)
#   PROMETHEUS_RETENTION_SIZE retención por tamaño (por defecto 1GB)

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: tukituki-mon-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-1GB}
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alertas.yml:/etc/prometheus/alertas.yml:ro
      - prometheus_data:/prometheus
    # Límites para que la observabilidad no compita con Dokploy ni con los
    # demás proyectos del host.
    mem_limit: 384m
    logging: *logging

  grafana:
    image: grafana/grafana:13.2.4
    container_name: tukituki-mon-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Define GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      # Al iniciar sesión se abre el dashboard de la aplicación.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/tukituki-aplicacion.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - default
    mem_limit: 384m
    logging: *logging

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: tukituki-mon-node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /:/host:ro,rslave
    command:
      - --path.rootfs=/host
    mem_limit: 64m
    logging: *logging

networks:
  default:
    external: true
    name: ${TUKI_DOCKER_NETWORK:-tuki-tuki-mcftoo_default}

volumes:
  prometheus_data:
  grafana_data:
