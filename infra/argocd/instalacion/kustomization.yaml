# Instalación reproducible de Argo CD.
#
# La versión queda fijada en la etiqueta del manifiesto oficial. Para
# actualizarla se cambia `v3.5.6` y se abre un PR; no se usa `stable` porque
# haría que el clúster cambiara sin revisión.
#
#   kubectl apply -k infra/argocd/instalacion
#
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - namespace.yaml
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.6/manifests/install.yaml
