apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# El clúster de escritorio ya puede tener el despliegue legacy en `tuki`;
# v2 usa un namespace propio para no pisarlo.
namespace: tukituki
resources:
  - ../../base
  - ../../../observability
images:
  - name: ghcr.io/lianlee007/tukituki-identidad
    newTag: local
  - name: ghcr.io/lianlee007/tukituki-restaurantes
    newTag: local
  - name: ghcr.io/lianlee007/tukituki-media
    newTag: local
  - name: ghcr.io/lianlee007/tukituki-pedidos
    newTag: local
  - name: ghcr.io/lianlee007/tukituki-resenas
    newTag: local
  - name: ghcr.io/lianlee007/tukituki-admin-service
    newTag: local
  - name: ghcr.io/lianlee007/tukituki-ai-gateway
    newTag: local
  - name: ghcr.io/lianlee007/tukituki-web-comensal
    newTag: local
  - name: ghcr.io/lianlee007/tukituki-web-panel
    newTag: local
  - name: ghcr.io/lianlee007/tukituki-web-admin
    newTag: local
replicas:
  - name: restaurantes-service
    count: 1
  - name: pedidos-service
    count: 1
  - name: web-comensal
    count: 1
# Las imágenes `:local` se publican en GHCR para el clúster de laboratorio; con
# `IfNotPresent` el kubelet reutilizaría una capa vieja. En producción se fija
# por digest y este parche no aplica.
patches:
  - target:
      kind: Deployment
      name: ".*-service"
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
