# Presupuestos de interrupción: durante un drain o una actualización del
# clúster siempre queda al menos un pod atendiendo. Con una réplica local el
# presupuesto protege el servicio; en producción los overlays suben réplicas.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: identidad-service
  namespace: tukituki
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: identidad-service
---
