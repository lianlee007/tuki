# Almacenamiento de objetos S3 para las imágenes del menú.
# MinIO dejó de publicar imágenes en octubre de 2025; RustFS expone la misma
# API S3 en el puerto 9000, así que el media-service no cambia.
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: tukituki
  labels:
    app: rustfs
spec:
  selector:
    app: rustfs
  ports:
    - name: api
      port: 9000
      targetPort: api
    - name: consola
      port: 9001
      targetPort: consola
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rustfs
  namespace: tukituki
spec:
  serviceName: rustfs
  replicas: 1
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.4
          args: ["/data"]
          ports:
            - name: api
              containerPort: 9000
            - name: consola
              containerPort: 9001
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: tukituki-secrets
                  key: s3-access-key
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: tukituki-secrets
                  key: s3-secret-key
            - name: RUSTFS_ADDRESS
              value: ":9000"
            - name: RUSTFS_CONSOLE_ADDRESS
              value: ":9001"
            - name: RUSTFS_CONSOLE_ENABLE
              value: "true"
            # El panel compone la tarjeta del QR en un lienzo y recorta el logo.
            # Leer píxeles de otro origen exige CORS, aunque mostrarlo en una
            # etiqueta `<img>` no lo necesite. Se reutilizan los orígenes de la
            # API para no mantener dos listas.
            - name: RUSTFS_CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: tukituki-config
                  key: CORS_ORIGENES
            - name: RUSTFS_OBS_LOGGER_LEVEL
              value: error
            - name: RUSTFS_OBS_LOG_DIRECTORY
              value: "/var/log/rustfs/"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /var/log/rustfs
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
      volumes:
        - name: logs
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
