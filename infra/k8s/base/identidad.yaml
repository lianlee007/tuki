apiVersion: apps/v1
kind: Deployment
metadata:
  name: identidad-service
  namespace: tuki
  labels:
    app: identidad-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identidad-service
  template:
    metadata:
      labels:
        app: identidad-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: migrar
          image: ghcr.io/lianlee007/tuki-v2-identidad:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/db/migrar.js"]
          envFrom:
            - configMapRef:
                name: tuki-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tuki-secrets
                  key: identidad-database-url
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: identidad
          image: ghcr.io/lianlee007/tuki-v2-identidad:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: tuki-config
          env:
            - name: PUERTO
              value: "3001"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tuki-secrets
                  key: identidad-database-url
            - name: JWT_SECRETO
              valueFrom:
                secretKeyRef:
                  name: tuki-secrets
                  key: jwt-secreto
            - name: SUPERADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: tuki-secrets
                  key: superadmin-email
            - name: SUPERADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tuki-secrets
                  key: superadmin-password
          readinessProbe:
            httpGet:
              path: /listo
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /salud
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: identidad-service
  namespace: tuki
  labels:
    app: identidad-service
spec:
  selector:
    app: identidad-service
  ports:
    - name: http
      port: 3001
      targetPort: http
