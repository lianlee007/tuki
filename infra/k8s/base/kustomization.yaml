apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tukituki
resources:
  - namespace.yaml
  - configmap.yaml
  - frontend-config.yaml
  # `secret.example.yaml` NO se aplica por GitOps: los secretos reales se
  # crean fuera del repositorio (Sealed Secrets / External Secrets). El archivo
  # queda como plantilla para un clúster nuevo:
  #   kubectl apply -f infra/k8s/base/secret.example.yaml
  - postgres.yaml
  - redis.yaml
  - rustfs.yaml
  - identidad.yaml
  - restaurantes.yaml
  - media.yaml
  - pedidos.yaml
  - resenas.yaml
  - admin-service.yaml
  - ai-gateway.yaml
  - web-comensal.yaml
  - panel-restaurante.yaml
  - admin-plataforma.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: postgres-init
    files:
      - postgres-init.sql
generatorOptions:
  disableNameSuffixHash: true
