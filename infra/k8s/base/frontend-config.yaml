apiVersion: v1
kind: ConfigMap
metadata:
  name: tukituki-frontend-config
  namespace: tukituki
  labels:
    app.kubernetes.io/part-of: tukituki
data:
  # Se monta como /config.js en los tres frontends. La misma imagen sirve para
  # local y para el clúster sin recompilar.
  config.js: |
    window.__TUKI_CONFIG__ = {
      identidad: 'https://api.tukituki.example.com',
      restaurantes: 'https://api.tukituki.example.com',
      media: 'https://api.tukituki.example.com',
      pedidos: 'https://api.tukituki.example.com',
      resenas: 'https://api.tukituki.example.com',
      admin: 'https://api.tukituki.example.com',
      adminPanel: 'https://admin.tukituki.example.com',
      web: 'https://tukituki.example.com',
      ai: 'https://api.tukituki.example.com'
    };
