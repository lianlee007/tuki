apiVersion: v1
kind: ConfigMap
metadata:
  name: tukituki-config
  namespace: tukituki
data:
  NODE_ENV: production
  JWT_EMISOR: tuki-identidad
  JWT_AUDIENCIA: tuki
  CORS_ORIGENES: >-
    https://tukituki.example.com,https://panel.tukituki.example.com,https://admin.tukituki.example.com
  RESTAURANTES_URL: http://restaurantes-service:3002
  IDENTIDAD_URL: http://identidad-service:3001
  PEDIDOS_URL: http://pedidos-service:3004
  S3_ENDPOINT: http://rustfs:9000
  S3_REGION: us-east-1
  S3_BUCKET: tuki-media
  S3_PUBLIC_URL: https://media.tukituki.example.com/tuki-media
  AI_ENVIRONMENT: production
  AI_AUTH_MODE: local
  AI_ALLOW_ANON: "true"
  # La IA es local: el gateway llama a Ollama en el equipo anfitrión.
  AI_OLLAMA_URL: http://host.docker.internal:11434
  AI_OLLAMA_MODELO_CHAT: tuki-chef
  AI_OLLAMA_MODELO_EMBEDDINGS: nomic-embed-text
  AI_RESTAURANTES_URL: http://restaurantes-service:3002
  AI_RESENAS_URL: http://resenas-service:3005
  AI_CORS_ORIGINS: >-
    https://tukituki.example.com,https://panel.tukituki.example.com,https://admin.tukituki.example.com
  # OpenTelemetry: los servicios Node y el AI Gateway envían trazas al
  # colector; si el endpoint no existe, la instrumentación queda apagada.
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.monitoring.svc.cluster.local:4318
  OTEL_SERVICE_NAMESPACE: tukituki
  AI_OTEL_ENABLED: "false"
  AI_OTEL_ENDPOINT: http://otel-collector.monitoring.svc.cluster.local:4318/v1/traces
