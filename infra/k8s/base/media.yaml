apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-service
  namespace: tukituki
  labels:
    app: media-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: media-service
  template:
    metadata:
      labels:
        app: media-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: migrar
          image: ghcr.io/lianlee007/tukituki-media:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/db/migrar.js"]
          envFrom:
            - configMapRef:
                name: tukituki-config
          env:
            - name: JWT_SECRETO
              valueFrom:
                secretKeyRef:
                  name: tukituki-secrets
                  key: jwt-secreto
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tukituki-secrets
                  key: media-database-url
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: media
          image: ghcr.io/lianlee007/tukituki-media:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3003
          envFrom:
            - configMapRef:
                name: tukituki-config
          env:
            - name: PUERTO
              value: "3003"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tukituki-secrets
                  key: media-database-url
            - name: JWT_SECRETO
              valueFrom:
                secretKeyRef:
                  name: tukituki-secrets
                  key: jwt-secreto
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: tukituki-secrets
                  key: s3-access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: tukituki-secrets
                  key: s3-secret-key
          readinessProbe:
            httpGet:
              path: /listo
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /salud
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: media-service
  namespace: tukituki
  labels:
    app: media-service
spec:
  selector:
    app: media-service
  ports:
    - name: http
      port: 3003
      targetPort: http
