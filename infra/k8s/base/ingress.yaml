apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tukituki
  namespace: tukituki
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "5"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - tukituki.example.com
        - panel.tukituki.example.com
        - admin.tukituki.example.com
        - api.tukituki.example.com
      secretName: tukituki-tls
  rules:
    - host: tukituki.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-comensal
                port:
                  name: http
    - host: panel.tukituki.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: panel-restaurante
                port:
                  name: http
    - host: admin.tukituki.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin-plataforma
                port:
                  name: http
    - host: api.tukituki.example.com
      http:
        paths:
          - path: /v1/identidad
            pathType: Prefix
            backend:
              service:
                name: identidad-service
                port:
                  name: http
          - path: /v1/restaurantes
            pathType: Prefix
            backend:
              service:
                name: restaurantes-service
                port:
                  name: http
          - path: /v1/media
            pathType: Prefix
            backend:
              service:
                name: media-service
                port:
                  name: http
          - path: /v1/pedidos
            pathType: Prefix
            backend:
              service:
                name: pedidos-service
                port:
                  name: http
          - path: /v1/resenas
            pathType: Prefix
            backend:
              service:
                name: resenas-service
                port:
                  name: http
          - path: /v1/admin
            pathType: Prefix
            backend:
              service:
                name: admin-service
                port:
                  name: http
          - path: /api/v1/ai
            pathType: Prefix
            backend:
              service:
                name: ai-gateway
                port:
                  name: http
